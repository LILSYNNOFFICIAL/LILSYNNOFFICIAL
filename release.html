<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LIL SYNN | Release</title>
  <meta name="description" content="Explore a LIL SYNN release, including artwork, tracks, streaming destinations, and related videos.">
  <link rel="canonical" href="https://lilsynn.com/release.html">
  <link rel="stylesheet" id="site-global-css" href="/site-global.css?v=20260914">
  <script src="/site-global.js?v=20260914"></script>
  <script src="/script.js?v=20260914"></script>
  <style>
    .release-detail{max-width:1180px;margin:0 auto;padding:48px 24px 90px;position:relative;z-index:2}.release-back{display:inline-flex;margin-bottom:28px}.release-hero{display:grid;grid-template-columns:minmax(280px,520px) minmax(0,1fr);gap:52px;align-items:center}.release-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;border:1px solid rgba(255,0,143,.28);box-shadow:0 30px 80px rgba(0,0,0,.5);background:#111}.release-kicker{font:700 .8rem Rajdhani,sans-serif;letter-spacing:.2em;color:var(--ls-glow)}.release-detail h1{margin:.35rem 0 .5rem;font:700 clamp(2.4rem,6vw,5.4rem)/.95 Orbitron,sans-serif;letter-spacing:.04em}.release-type{color:#aaa;font:600 1.1rem Rajdhani,sans-serif;letter-spacing:.12em}.release-copy{color:#bbb;font:1.08rem/1.6 Rajdhani,sans-serif;max-width:650px}.release-actions{display:flex;flex-wrap:wrap;gap:.7rem;margin:26px 0}.release-tracks{margin-top:64px}.release-tracks h2,.release-related h2{font:700 clamp(1.7rem,4vw,2.7rem) Orbitron,sans-serif;color:var(--ls-pink)}.track-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}.track{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid rgba(255,0,143,.16);border-radius:14px;background:rgba(5,5,8,.68)}.track-number{color:var(--ls-glow);font:700 .85rem Rajdhani,sans-serif;min-width:28px}.track-name{flex:1;color:#fff;font:600 1rem Rajdhani,sans-serif}.track a{color:#aaa;text-decoration:none;font:700 .75rem Rajdhani,sans-serif;letter-spacing:.08em}.track a:hover{color:var(--ls-glow)}.release-related{margin-top:64px}.empty-release{text-align:center;padding:90px 24px}.empty-release h1{font:700 clamp(2rem,5vw,4rem) Orbitron,sans-serif;color:var(--ls-pink)}@media(max-width:800px){.release-hero{grid-template-columns:1fr;gap:30px}.release-art{max-width:520px;margin:auto}.track-list{grid-template-columns:1fr}.release-detail{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
<main class="release-detail" id="release-detail"><a class="cta-secondary release-back" href="/releases.html">← RELEASE ARCHIVE</a><div id="release-root" class="empty-release"><p class="section-kicker">LOADING RELEASE</p><h1>ACCESSING SIGNAL</h1></div></main>
<script>
(async()=>{
 const root=document.getElementById('release-root');const params=new URLSearchParams(location.search);const requested=params.get('id')||params.get('release')||'';
 const norm=v=>String(v??'').toLowerCase().normalize('NFKD').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'');
 try{
  const catalog=await fetch('/release-catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()});
  const order=Array.isArray(catalog.order)?catalog.order:[];const title=order.find(x=>norm(x)===norm(requested))||requested;const group=catalog.groups?.[title];
  if(!title||(!group&&!(catalog.spotify?.[title]||catalog.trackSpotify?.[title]||catalog.apple?.[title]||catalog.soundcloud?.[title]))){root.innerHTML='<div class="empty-release"><p class="section-kicker">SIGNAL NOT FOUND</p><h1>RELEASE UNAVAILABLE</h1><p class="release-copy">That release identity is not present in the canonical catalog.</p><a class="cta-primary" href="/releases.html">RETURN TO ARCHIVE</a></div>';return}
  const art=(window.LIL_SYNN_ART_MAP||{})[norm(title)]||'';const artUrl=art?'/assets/images/icons/album_art/'+encodeURIComponent(art):'';const tracks=group?.tracks?.length?group.tracks:[title];
  const streams=[];const add=(label,href)=>{if(href&&!streams.some(x=>x.href===href))streams.push({label,href})};add('SPOTIFY',group?.spotify||catalog.spotify?.[title]||catalog.trackSpotify?.[title]);add('APPLE MUSIC',group?.apple||catalog.apple?.[title]);add('SOUNDCLOUD',group?.soundcloud||catalog.soundcloud?.[title]);
  document.title='LIL SYNN | '+title;const d=document.querySelector('meta[name="description"]');if(d)d.content=title+' by LIL SYNN. Explore artwork, tracks, streaming destinations, and related music.';
  root.className='';root.innerHTML=`<div class="release-hero">${artUrl?`<img class="release-art" src="${artUrl}" alt="${title.replace(/\"/g,'&quot;')} artwork" loading="eager" decoding="async">`:'<div class="release-art" aria-hidden="true"></div>'}<div><span class="release-kicker">LIL SYNN RELEASE</span><h1>${title}</h1><div class="release-type">${group?.type||'SINGLE'}</div><p class="release-copy">Explore the release identity, tracklist, and official listening destinations.</p><div class="release-actions">${streams.map(x=>`<a class="cta-primary" href="${x.href}" target="_blank" rel="noopener noreferrer">${x.label}</a>`).join('')}</div></div></div><section class="release-tracks" aria-labelledby="track-heading"><h2 id="track-heading">TRACKLIST</h2><div class="track-list">${tracks.map((t,i)=>{const href=catalog.trackSpotify?.[t]||catalog.spotify?.[t]||'';return `<div class="track"><span class="track-number">${String(i+1).padStart(2,'0')}</span><span class="track-name">${t}</span>${href?`<a href="${href}" target="_blank" rel="noopener noreferrer">SPOTIFY ↗</a>`:''}</div>`}).join('')}</div></section><section class="release-related"><h2>KEEP EXPLORING</h2><p class="release-copy">Find more releases, videos, and the wider LIL SYNN catalog.</p><div class="release-actions"><a class="cta-secondary" href="/releases.html">ALL RELEASES</a><a class="cta-secondary" href="/#videos">LATEST VIDEOS</a><a class="cta-secondary" href="/#music">MUSIC</a></div></section>`;
 }catch{root.innerHTML='<div class="empty-release"><p class="section-kicker">SIGNAL ERROR</p><h1>CATALOG OFFLINE</h1><p class="release-copy">The release catalog could not be loaded. Please try again.</p></div>'}
})();
</script>
</body>
</html>
