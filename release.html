<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LIL SYNN | Release</title>
  <meta name="description" content="Explore a LIL SYNN release, including artwork, tracks, streaming destinations, and related releases.">
  <link rel="canonical" href="https://lilsynn.com/release.html">
  <meta property="og:type" content="music.album">
  <meta property="og:title" content="LIL SYNN | Release">
  <meta property="og:description" content="Explore a LIL SYNN release and its official listening destinations.">
  <meta property="og:url" content="https://lilsynn.com/release.html">
  <link rel="stylesheet" id="site-global-css" href="/site-global.css?v=20260914">
  <script src="/site-global.js?v=20260914"></script>
  <script src="/script.js?v=20260914"></script>
  <style>
    .release-detail{max-width:1180px;margin:0 auto;padding:48px 24px 90px;position:relative;z-index:2}.release-back{display:inline-flex;margin-bottom:28px}.release-hero{display:grid;grid-template-columns:minmax(280px,520px) minmax(0,1fr);gap:52px;align-items:center}.release-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;border:1px solid rgba(255,0,143,.28);box-shadow:0 30px 80px rgba(0,0,0,.5);background:#111}.release-kicker{font:700 .8rem Rajdhani,sans-serif;letter-spacing:.2em;color:var(--ls-glow)}.release-detail h1{margin:.35rem 0 .5rem;font:700 clamp(2.4rem,6vw,5.4rem)/.95 Orbitron,sans-serif;letter-spacing:.04em}.release-type{color:#aaa;font:600 1.1rem Rajdhani,sans-serif;letter-spacing:.12em}.release-copy{color:#bbb;font:1.08rem/1.6 Rajdhani,sans-serif;max-width:650px}.release-actions{display:flex;flex-wrap:wrap;gap:.7rem;margin:26px 0}.release-tracks{margin-top:64px}.release-tracks h2,.release-related h2,.release-nav h2{font:700 clamp(1.7rem,4vw,2.7rem) Orbitron,sans-serif;color:var(--ls-pink)}.track-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}.track{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid rgba(255,0,143,.16);border-radius:14px;background:rgba(5,5,8,.68)}.track-number{color:var(--ls-glow);font:700 .85rem Rajdhani,sans-serif;min-width:28px}.track-name{flex:1;color:#fff;font:600 1rem Rajdhani,sans-serif}.track a{color:#aaa;text-decoration:none;font:700 .75rem Rajdhani,sans-serif;letter-spacing:.08em}.track a:hover{color:var(--ls-glow)}.release-related{margin-top:64px}.release-nav{margin-top:64px}.release-nav-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}.release-nav-card,.related-card{display:block;padding:20px;border:1px solid rgba(255,0,143,.2);border-radius:16px;background:rgba(5,5,8,.72);color:#fff;text-decoration:none;transition:transform .2s ease,border-color .2s ease,background .2s ease}.release-nav-card:hover,.release-nav-card:focus-visible,.related-card:hover,.related-card:focus-visible{transform:translateY(-2px);border-color:rgba(255,0,143,.55);background:rgba(12,8,12,.9)}.release-nav-label,.related-type{display:block;color:var(--ls-glow);font:700 .72rem Rajdhani,sans-serif;letter-spacing:.16em;margin-bottom:7px}.release-nav-title,.related-title{font:700 1.05rem Orbitron,sans-serif}.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}.empty-release{text-align:center;padding:90px 24px}.empty-release h1{font:700 clamp(2rem,5vw,4rem) Orbitron,sans-serif;color:var(--ls-pink)}@media(max-width:800px){.release-hero{grid-template-columns:1fr;gap:30px}.release-art{max-width:520px;margin:auto}.track-list,.release-nav-grid{grid-template-columns:1fr}.release-detail{padding-left:16px;padding-right:16px}.related-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.related-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="release-detail" id="release-detail"><a class="cta-secondary release-back" href="/releases.html">← RELEASE ARCHIVE</a><div id="release-root" class="empty-release"><p class="section-kicker">LOADING RELEASE</p><h1>ACCESSING SIGNAL</h1></div></main>
<script>
(async()=>{
 const root=document.getElementById('release-root');const params=new URLSearchParams(location.search);const requested=params.get('id')||params.get('release')||'';
 const norm=v=>String(v??'').toLowerCase().normalize('NFKD').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 try{
  const catalog=await fetch('/release-catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()});
  const order=Array.isArray(catalog.order)?catalog.order:[];const title=order.find(x=>norm(x)===norm(requested))||requested;const group=catalog.groups?.[title];
  if(!title||(!group&&!(catalog.spotify?.[title]||catalog.trackSpotify?.[title]||catalog.apple?.[title]||catalog.soundcloud?.[title]))){root.innerHTML='<div class="empty-release"><p class="section-kicker">SIGNAL NOT FOUND</p><h1>RELEASE UNAVAILABLE</h1><p class="release-copy">That release identity is not present in the canonical catalog.</p><a class="cta-primary" href="/releases.html">RETURN TO ARCHIVE</a></div>';return}
  const art=(window.LIL_SYNN_ART_MAP||{})[norm(title)]||'';const artUrl=art?'/assets/images/icons/album_art/'+encodeURIComponent(art):'';const tracks=group?.tracks?.length?group.tracks:[title];
  const streams=[];const add=(label,href)=>{if(href&&!streams.some(x=>x.href===href))streams.push({label,href})};add('SPOTIFY',group?.spotify||catalog.spotify?.[title]||catalog.trackSpotify?.[title]);add('APPLE MUSIC',group?.apple||catalog.apple?.[title]);add('SOUNDCLOUD',group?.soundcloud||catalog.soundcloud?.[title]);
  const index=order.findIndex(x=>norm(x)===norm(title));const previous=index>0?order[index-1]:null;const next=index>=0&&index<order.length-1?order[index+1]:null;const nearby=order.filter(x=>norm(x)!==norm(title)).slice(Math.max(0,index-1),Math.min(order.length,index+2)).filter(x=>x!==previous&&x!==next).slice(0,3);
  document.title='LIL SYNN | '+title;const d=document.querySelector('meta[name="description"]');if(d)d.content=title+' by LIL SYNN. Explore artwork, tracks, streaming destinations, and related releases.';const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle)ogTitle.content='LIL SYNN | '+title;const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc)ogDesc.content='Explore '+title+' by LIL SYNN and its official listening destinations.';const ogUrl=document.querySelector('meta[property="og:url"]');if(ogUrl)ogUrl.content=location.href;
  root.className='';root.innerHTML=`<div class="release-hero">${artUrl?`<img class="release-art" src="${artUrl}" alt="${esc(title)} artwork" loading="eager" decoding="async">`:'<div class="release-art" aria-hidden="true"></div>'}<div><span class="release-kicker">LIL SYNN RELEASE</span><h1>${esc(title)}</h1><div class="release-type">${esc(group?.type||'SINGLE')}</div><p class="release-copy">Explore the release identity, tracklist, and official listening destinations.</p><div class="release-actions">${streams.map(x=>`<a class="cta-primary" href="${esc(x.href)}" target="_blank" rel="noopener noreferrer">${x.label}</a>`).join('')}</div></div></div><section class="release-tracks" aria-labelledby="track-heading"><h2 id="track-heading">TRACKLIST</h2><div class="track-list">${tracks.map((t,i)=>{const href=catalog.trackSpotify?.[t]||catalog.spotify?.[t]||'';return `<div class="track"><span class="track-number">${String(i+1).padStart(2,'0')}</span><span class="track-name">${esc(t)}</span>${href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">SPOTIFY ↗</a>`:''}</div>`}).join('')}</div></section><section class="release-nav" aria-labelledby="release-nav-heading"><h2 id="release-nav-heading">CONTINUE EXPLORING</h2><div class="release-nav-grid">${previous?`<a class="release-nav-card" href="/release.html?id=${encodeURIComponent(previous)}"><span class="release-nav-label">← PREVIOUS RELEASE</span><span class="release-nav-title">${esc(previous)}</span></a>`:''}${next?`<a class="release-nav-card" href="/release.html?id=${encodeURIComponent(next)}"><span class="release-nav-label">NEXT RELEASE →</span><span class="release-nav-title">${esc(next)}</span></a>`:''}</div></section><section class="release-related" aria-labelledby="related-heading"><h2 id="related-heading">MORE FROM THE ARCHIVE</h2><div class="related-grid">${nearby.map(t=>`<a class="related-card" href="/release.html?id=${encodeURIComponent(t)}"><span class="related-type">${esc(catalog.groups?.[t]?.type||'SINGLE')}</span><span class="related-title">${esc(t)}</span></a>`).join('')}</div><div class="release-actions"><a class="cta-secondary" href="/releases.html">ALL RELEASES</a><a class="cta-secondary" href="/#videos">LATEST VIDEOS</a><a class="cta-secondary" href="/#music">MUSIC</a></div></section>`;
 }catch{root.innerHTML='<div class="empty-release"><p class="section-kicker">SIGNAL ERROR</p><h1>CATALOG OFFLINE</h1><p class="release-copy">The release catalog could not be loaded. Please try again.</p></div>'}
})();
</script>
</body>
</html>
