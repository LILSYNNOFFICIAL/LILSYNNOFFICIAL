name: Optimize index2 WebM assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Encode candidates and keep the smallest useful output
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for src in assets/mov/HERO_BG_WEBM.webm assets/mov/LS_BG_STARS.webm; do
            [ -f "$src" ] || continue
            base="${src%.webm}"
            old=$(stat -c%s "$src")
            best_tmp=""
            best_size="$old"

            for profile in "960 40 24" "854 42 24" "720 44 24"; do
              read -r width crf fps <<< "$profile"
              tmp="${base}.candidate-${width}-${crf}-${fps}.webm"
              ffmpeg -y -i "$src" \
                -map 0:v:0 -an \
                -vf "scale='min(${width},iw)':-2,fps=${fps}" \
                -c:v libvpx-vp9 -b:v 0 -crf "$crf" -deadline good -cpu-used 4 \
                "$tmp" >/dev/null 2>&1
              size=$(stat -c%s "$tmp")
              echo "$src candidate ${width}px CRF${crf} ${fps}fps: $size bytes"
              if [ "$size" -lt "$best_size" ]; then
                [ -z "$best_tmp" ] || rm -f "$best_tmp"
                best_tmp="$tmp"
                best_size="$size"
              else
                rm -f "$tmp"
              fi
            done

            echo "$src: $old -> $best_size bytes"
            if [ -n "$best_tmp" ] && [ "$best_size" -lt "$old" ]; then
              mv "$best_tmp" "$src"
              changed=1
            else
              [ -z "$best_tmp" ] || rm -f "$best_tmp"
            fi
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/mov/*.webm
            git commit -m "chore: aggressively reduce index2 WebM assets [skip ci]"
            git push
          else
            echo "No smaller WebM output produced. Existing files left untouched."
          fi
