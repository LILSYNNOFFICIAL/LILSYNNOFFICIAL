name: Refresh Latest Videos
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Discover newest channel uploads by actual upload timestamp
        shell: bash
        run: |
          set -euo pipefail
          yt-dlp --skip-download --ignore-errors --no-warnings --playlist-end 60 --dump-single-json 'https://www.youtube.com/@LILSYNNOFFICIAL/videos' > /tmp/videos.json
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          data=json.load(open('/tmp/videos.json',encoding='utf-8'))
          entries=data.get('entries') or []
          videos=[]
          for e in entries:
              if not e or not e.get('id'): continue
              ts=e.get('timestamp') or e.get('release_timestamp')
              upload=e.get('upload_date') or ''
              if not ts and len(upload)==8:
                  ts=datetime.strptime(upload,'%Y%m%d').replace(tzinfo=timezone.utc).timestamp()
              if not ts: continue
              if isinstance(ts,(int,float)):
                  published=datetime.fromtimestamp(ts,timezone.utc).isoformat()
              else:
                  published=str(ts)
              videos.append({'id':e['id'],'title':e.get('title') or e['id'],'publishedAt':published})
          unique={v['id']:v for v in videos}
          latest=sorted(unique.values(),key=lambda x:x['publishedAt'],reverse=True)[:9]
          if len(latest)<9:
              raise SystemExit(f'Only found {len(latest)} dated uploads from the LIL SYNN channel')
          out={'generatedAt':datetime.now(timezone.utc).isoformat(),'source':'https://www.youtube.com/@LILSYNNOFFICIAL/videos','selection':'newest 9 channel uploads by actual upload timestamp','videos':latest}
          pathlib.Path('latest-videos.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(latest,indent=2,ensure_ascii=False))
          PY
      - name: Ensure manifest renderer is loaded after site scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="latest-videos.js"></script>'
          if tag not in s:
              marker='<script src="music-random.js"></script>'
              if marker not in s: raise SystemExit('music-random script marker not found')
              s=s.replace(marker,marker+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refreshed manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-videos.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh latest 9 YouTube videos by upload date [skip ci]'
          git push
