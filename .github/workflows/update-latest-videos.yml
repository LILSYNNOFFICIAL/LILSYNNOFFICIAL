name: Refresh Latest Videos
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install current yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Discover releases from the YouTube Releases tab only
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_API_KEY:-}" || { echo 'YOUTUBE_API_KEY GitHub Actions secret is missing'; exit 1; }
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timezone

          key=os.environ['YOUTUBE_API_KEY']
          releases_url='https://www.youtube.com/@LILSYNNOFFICIAL/releases'

          # yt-dlp is pointed at the Releases tab itself. This deliberately
          # does not use /videos, /shorts, /streams, uploads, search, or home.
          cmd=['yt-dlp','--flat-playlist','--dump-single-json','--no-warnings',releases_url]
          raw=subprocess.check_output(cmd,text=True)
          data=json.loads(raw)
          entries=data.get('entries') or []
          playlist_ids=[]
          seen_playlists=set()
          for e in entries:
              if not e: continue
              pid=e.get('id')
              url=e.get('webpage_url') or e.get('url')
              if pid and (e.get('_type')=='url' or e.get('ie_key','').lower().startswith('youtube')):
                  if url and 'playlist?list=' in url:
                      pid=urllib.parse.parse_qs(urllib.parse.urlparse(url).query).get('list',[pid])[0]
                  if pid not in seen_playlists:
                      seen_playlists.add(pid); playlist_ids.append(pid)
          if not playlist_ids:
              raise SystemExit('No release playlists were discovered from the LIL SYNN /releases tab')

          def api(path, params):
              q=urllib.parse.urlencode({**params,'key':key})
              with urllib.request.urlopen('https://www.googleapis.com/youtube/v3/'+path+'?'+q,timeout=30) as r:
                  body=json.load(r)
              if 'error' in body: raise SystemExit(body['error'].get('message','YouTube API error'))
              return body

          ids=[]; seen=set()
          for pid in playlist_ids[:20]:
              page=api('playlistItems',{'part':'snippet,contentDetails','playlistId':pid,'maxResults':50})
              for item in page.get('items',[]):
                  vid=((item.get('contentDetails') or {}).get('videoId'))
                  if vid and vid not in seen:
                      seen.add(vid); ids.append(vid)

          if not ids:
              raise SystemExit('The YouTube Releases tab contained no videos')

          videos=[]
          for i in range(0,len(ids),50):
              body=api('videos',{'part':'snippet','id':','.join(ids[i:i+50])})
              for item in body.get('items',[]):
                  published=(item.get('snippet') or {}).get('publishedAt')
                  if item.get('id') and published:
                      videos.append({'id':item['id'],'title':(item.get('snippet') or {}).get('title') or item['id'],'publishedAt':published})

          latest=sorted({v['id']:v for v in videos}.values(),key=lambda x:x['publishedAt'],reverse=True)[:9]
          if not latest:
              raise SystemExit('No dated videos were found in the YouTube Releases tab')

          out={
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'source':releases_url,
              'selection':'newest 9 videos from release playlists on the Releases tab by publishedAt',
              'videos':latest
          }
          pathlib.Path('latest-videos.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(latest,indent=2,ensure_ascii=False))
          PY
      - name: Commit refreshed release manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].com'
          git add latest-videos.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh latest 9 YouTube releases [skip ci]'
          git push
