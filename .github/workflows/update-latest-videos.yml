name: Refresh Latest Videos logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Latest Videos renderer
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='site-polish.js';
          let s=fs.readFileSync(path,'utf8');
          const start=s.indexOf(' const videoGrid=document.getElementById(\'youtube-grid\');');
          const end=s.indexOf(' const hero=document.getElementById(\'home\');',start);
          if(start<0||end<0) throw new Error('Latest Videos block markers not found');
          const block=` const videoGrid=document.getElementById('youtube-grid');\n if(videoGrid){\n   try{\n     const r=await fetch('/api/latest-youtube-releases?refresh='+Date.now(),{cache:'no-store'});\n     if(!r.ok) throw new Error('YouTube release feed unavailable');\n     const data=await r.json();\n     const videos=(data.videos||[]).slice(0,9);\n     videoGrid.innerHTML=videos.map(v=>\`<article class="glass rounded-3xl overflow-hidden border border-[#ff008f]/30 hover:border-[#ff4fd8]"><div class="relative youtube-card" data-video-id="\${v.id}" data-video-title="\${esc(v.title)}" style="aspect-ratio:16/9;background:#000;overflow:hidden"><img src="https://i.ytimg.com/vi/\${v.id}/hqdefault.jpg" alt="\${esc(v.title)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="lazy" decoding="async"><button type="button" class="youtube-play-overlay" aria-label="Play \${esc(v.title)}" style="position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer"><span style="display:flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:999px;background:rgba(255,0,143,.94);box-shadow:0 0 28px rgba(255,0,143,.55);color:#fff;font-size:30px;padding-left:5px">▶</span></button></div><div class="p-4 text-sm font-['Rajdhani'] text-center">\${esc(v.title)}</div></article>\`).join('');\n     $$('.youtube-card').forEach(card=>card.querySelector('.youtube-play-overlay')?.addEventListener('click',()=>{const id=card.dataset.videoId,title=card.dataset.videoTitle,iframe=document.createElement('iframe');iframe.title=\`LIL SYNN — \${title}\`;iframe.src=\`https://www.youtube-nocookie.com/embed/\${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0&modestbranding=1\`;iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture; web-share';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000';card.innerHTML='';card.appendChild(iframe)}));\n   }catch(e){console.warn('Dynamic YouTube releases unavailable',e)}\n }\n\n`;
          s=s.slice(0,start)+block+s.slice(end);
          fs.writeFileSync(path,s);
          NODE
      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-polish.js
          git diff --cached --quiet || git commit -m "Auto-update Latest Videos from YouTube release dates [skip ci]"
          git push
