name: Refresh Latest Videos
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover newest channel uploads with YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_API_KEY:-}" || { echo 'YOUTUBE_API_KEY GitHub Actions secret is missing'; exit 1; }
          python - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone
          key=os.environ['YOUTUBE_API_KEY']
          channel='UCfJ2K7mKqJ4u6o7g4G6k5xQ'
          def api(path, params):
              q=urllib.parse.urlencode({**params,'key':key})
              with urllib.request.urlopen('https://www.googleapis.com/youtube/v3/'+path+'?'+q,timeout=30) as r:
                  return json.load(r)
          # Resolve the channel ID from the handle, avoiding any scraping of YouTube HTML.
          c=api('channels',{'part':'contentDetails,snippet','forHandle':'@LILSYNNOFFICIAL'})
          if not c.get('items'):
              # Fallback to the known channel ID only if handle lookup is unavailable.
              c=api('channels',{'part':'contentDetails,snippet','id':channel})
          if not c.get('items'):
              raise SystemExit('YouTube channel could not be resolved')
          ch=c['items'][0]
          uploads=ch['contentDetails']['relatedPlaylists']['uploads']
          items=[]; token=None
          while len(items)<50:
              params={'part':'snippet,contentDetails','playlistId':uploads,'maxResults':50}
              if token: params['pageToken']=token
              page=api('playlistItems',params)
              items.extend(page.get('items',[]))
              token=page.get('nextPageToken')
              if not token: break
          videos=[]
          for item in items:
              sn=item.get('snippet') or {}
              vid=((item.get('contentDetails') or {}).get('videoId'))
              if not vid: continue
              published=sn.get('publishedAt')
              if not published: continue
              videos.append({'id':vid,'title':sn.get('title') or vid,'publishedAt':published})
          unique={v['id']:v for v in videos}
          latest=sorted(unique.values(),key=lambda x:x['publishedAt'],reverse=True)[:9]
          if len(latest)<9:
              raise SystemExit(f'Only found {len(latest)} dated uploads from the LIL SYNN channel')
          out={'generatedAt':datetime.now(timezone.utc).isoformat(),'source':'https://www.youtube.com/@LILSYNNOFFICIAL/releases','selection':'newest 9 channel uploads by publishedAt','videos':latest}
          pathlib.Path('latest-videos.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(latest,indent=2,ensure_ascii=False))
          PY
      - name: Ensure manifest renderer is loaded after site scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="latest-videos.js"></script>'
          if tag not in s:
              marker='<script src="music-random.js"></script>'
              if marker not in s: raise SystemExit('music-random script marker not found')
              s=s.replace(marker,marker+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refreshed manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].com'
          git add latest-videos.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh latest 9 YouTube videos by published date [skip ci]'
          git push
