name: Restore THE SIGNAL homepage shell

on:
  workflow_run:
    workflows: ["Validate and normalize site architecture"]
    types: [completed]

permissions:
  contents: write

jobs:
  restore-modern-home:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalized main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy shell from promoted homepage
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # index2 was promoted to index.html. The promoted homepage owns
          # its THE SIGNAL header/navigation and must not load site-global.
          html = re.sub(
              r'<link\b[^>]*\bhref=["\']/site-global\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
              '', html, flags=re.I
          )
          html = re.sub(
              r'<script\b[^>]*\bsrc=["\']/site-global\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
              '', html, flags=re.I
          )

          # Install the active homepage-only visual patch exactly once.
          html = re.sub(
              r'<script\b[^>]*\bsrc=["\']/homepage-final-fix\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*',
              '', html, flags=re.I
          )
          html = re.sub(
              r'</head>',
              '<script src="/homepage-final-fix.js"></script></head>',
              html, count=1, flags=re.I
          )

          path.write_text(html, encoding='utf-8')

      - name: Verify homepage shell
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LIL SYNN — THE SIGNAL' index.html
          grep -q 'class="topbar"' index.html
          grep -q '/homepage-final-fix.js' index.html
          ! grep -qi '/site-global\.js' index.html
          ! grep -qi '/site-global\.css' index.html
          test -f homepage-final-fix.js

      - name: Commit homepage restoration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Homepage already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: keep promoted THE SIGNAL homepage independent of legacy shell [skip ci]'
          git push origin main
