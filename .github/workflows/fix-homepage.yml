name: Validate canonical site architecture

on:
  push:
    branches: [main, full-site-shell-update]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize canonical shell references
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path('.')
          excluded = {'index.html','index2.html','404.html','vote.html'}
          legacy_js = re.compile(r'''<script\b[^>]*\bsrc=["']\/site-global\.js(?:\?[^"']*)?["'][^>]*>\s*</script>\s*''', re.I)
          legacy_css = re.compile(r'''<link\b[^>]*\bhref=["']\/site-global\.css(?:\?[^"']*)?["'][^>]*>\s*''', re.I)
          shell_js = re.compile(r'''<script\b[^>]*\bsrc=["']\/site-shell\.js(?:\?[^"']*)?["'][^>]*>\s*</script>\s*''', re.I)

          for p in root.glob('*.html'):
              if p.name.lower() in excluded:
                  continue
              s = p.read_text(encoding='utf-8')
              before = s
              s = legacy_css.sub('', s)
              s = legacy_js.sub('', s)
              s = shell_js.sub('', s)
              s = re.sub(r'</head>', '<script src="/site-shell.js?v=20260917"></script></head>', s, count=1, flags=re.I)
              if s != before:
                  p.write_text(s, encoding='utf-8')
                  print('canonical shell:', p.name)

      - name: Generate WebM manifest
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: python
        run: |
          import json
          from pathlib import Path
          files = sorted([p.name for p in Path('assets/mov').glob('*.webm') if p.is_file()], key=str.lower)
          Path('assets/mov/index.json').write_text(json.dumps(files, indent=2) + '\n', encoding='utf-8')

      - name: Commit canonical repairs
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize canonical site shell [skip ci]'
          git push

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vote.html
          test -f releases.html
          test -f archive.html
          test -f release.html
          test -f gallery.html
          test -f universe.html
          test -f special_access.html
          test -f coming_soon.html
          test -f privacy.html
          test -f terms.html
          test -f site-shell.js
          test -f site-shell.css
          test -f release-catalog.json
          test -f assets/mov/LS_BG_STARS.webm
          test -f assets/mov/index.json
          ! test -f site-global.js
          ! test -f site-global.css
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --exclude='*.md' 'site-global.js' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --exclude='*.md' 'site-global.css' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --include='*.html' 'id="sideMenu"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --include='*.html' 'class="nav"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --include='*.html' 'href="/vote#contact"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --include='*.html' 'href="/index.html/contact"' .
          ! grep -n 'site-global.js' vote.html
          grep -q '/homepage-final-fix.js' index.html
          grep -q 'LS_BG_STARS.webm' site-shell.js
          grep -q 'signal-geometry-layer' homepage-final-fix.js

      - name: Validate release catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('release-catalog.json').read_text(encoding='utf-8'))
          assert data.get('order'), 'release catalog order is empty'
          assert len(dict.fromkeys(data['order'])) == len(data['order']), 'duplicate release order entries'
          assert data['order'][:3] == ['Never Known','HOME (ACOUSTIC VERSION)','I DID IT AGAIN']
          print('Release catalog validation passed.')
          PY

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-homepage-final-fix.mjs
          node scripts/test-vote-page.mjs
          node scripts/test-site-shell.mjs
