name: Apply homepage fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the four section-art images from the homepage wherever they occur.
          for name in ['MERCH_SHOP.png', 'LATEST_RELEASES.png', 'LISTEN.png', 'MUSIC.png']:
              s = re.sub(r'<(?:a|div)[^>]*>\s*<img[^>]*' + re.escape(name) + r'[^>]*>\s*</(?:a|div)>', '', s, flags=re.I|re.S)
              s = re.sub(r'<img[^>]*' + re.escape(name) + r'[^>]*>', '', s, flags=re.I|re.S)

          # Keep exactly one LS.png hero mark immediately above the LIL SYNN heading.
          s = re.sub(r'<img[^>]*LS\.png[^>]*>', '', s, flags=re.I|re.S)
          marker = '<h1 class="font-[\'Orbitron\'] text-4xl md:text-6xl tracking-[0.18em] text-white drop-shadow-2xl">LIL SYNN</h1>'
          ls = '<img src="assets/img/LS.png" alt="LIL SYNN" class="mx-auto mb-5 w-[min(72vw,420px)] max-h-[260px] object-contain" loading="eager" decoding="async">'
          if marker in s and ls not in s:
              s = s.replace(marker, ls + marker, 1)

          # Load the final behavior layer after the existing scripts.
          tag = '<script src="homepage-final-fixes.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY

          cat > homepage-final-fixes.js <<'JS'
          (() => {
            const init = () => {
              // The homepage should use only LS.png as the section artwork.
              document.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src') || '';
                if (/MERCH_SHOP\.png|LATEST_RELEASES\.png|LISTEN\.png|MUSIC\.png/i.test(src)) {
                  const wrapper = img.closest('a');
                  if (wrapper && wrapper.children.length === 1) wrapper.remove();
                  else img.remove();
                }
              });

              // Rename the existing random/discover control to the exact requested label.
              const candidates = Array.from(document.querySelectorAll('button, a'));
              const refresh = candidates.find(el => {
                const t = (el.textContent || '').trim().toLowerCase();
                const id = (el.id || '').toLowerCase();
                const cls = (el.className || '').toString().toLowerCase();
                return /random\s*song|discover/.test(t) || /random.*(song|music)|discover/.test(id + ' ' + cls);
              });

              if (refresh) {
                refresh.textContent = 'Random Song Refresh';
                refresh.setAttribute('aria-label', 'Refresh random songs');
                refresh.setAttribute('type', 'button');
                refresh.addEventListener('click', event => {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  if (typeof window.lilSynnRefreshMusic === 'function') {
                    window.lilSynnRefreshMusic();
                  }
                }, true);
              }
            };

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
            else init();
          })();
          JS

          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'LIL SYNN Website Bot'
          git config user.email 'lilsynn89@gmail.com'
          git add index.html homepage-final-fixes.js
          git commit -m 'Use LS artwork and fix Random Song Refresh'
          git push
