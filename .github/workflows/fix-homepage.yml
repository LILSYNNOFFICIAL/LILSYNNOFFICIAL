name: Validate and clean site architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and repair source
        if: github.event_name == 'push'
        shell: python
        run: |
          import re
          from pathlib import Path

          def update(path, transform):
              p=Path(path)
              if not p.exists(): return
              s=p.read_text(encoding='utf-8')
              out=transform(s)
              if out != s:
                  p.write_text(out, encoding='utf-8')
                  print('updated', path)

          def strip_legacy_shell(s):
              s=re.sub(r'<video\b[^>]*\bid=["\']bg["\'][^>]*>.*?</video>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<div\b[^>]*\bid=["\']ov["\'][^>]*>.*?</div>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<nav\b[^>]*\bclass=["\'][^"\']*\bnav\b[^"\']*["\'][^>]*>.*?</nav>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<div\b[^>]*\bid=["\']menu["\'][^>]*>.*?(?=<header\b|<main\b)', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<nav\b(?![^>]*class=)[^>]*>.*?</nav>\s*</div>\s*(?=<header\b|<main\b)', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<header\b[^>]*\bclass=["\'][^"\']*\bhero\b[^"\']*["\'][^>]*>.*?</header>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<footer\b[^>]*\bclass=["\'][^"\']*\bfooter\b[^"\']*["\'][^>]*>.*?</footer>', '', s, flags=re.I|re.S)
              s=re.sub(r'<script>\s*const h=document\.getElementById\(["\']hamb["\']\).*?</script>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<script[^>]+src=["\']/site-global\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', '', s, flags=re.I)
              s=re.sub(r'<link[^>]+href=["\']/site-global\.css(?:\?[^"\']*)?["\'][^>]*>', '', s, flags=re.I)
              return s

          for page in ('privacy.html','terms.html','special_access.html'):
              update(page, strip_legacy_shell)

          def special(s):
              s=strip_legacy_shell(s)
              head='<meta name="description" content="LIL SYNN Special Access archive for exclusive recordings, alternate versions, visuals, and unreleased material."><link rel="canonical" href="https://lilsynn.com/special_access.html"><link rel="stylesheet" href="/site-global.css?v=20260911"><script src="/site-global.js?v=20260911"></script>'
              s=re.sub(r'</head>', head+'</head>', s, count=1, flags=re.I)
              return s
          update('special_access.html', special)

          def coming(s):
              s=re.sub(r'<video\b[^>]*\bid=["\']bg["\'][^>]*>.*?</video>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<script[^>]+src=["\']/site-global\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', '', s, flags=re.I)
              s=re.sub(r'<link[^>]+href=["\']/site-global\.css(?:\?[^"\']*)?["\'][^>]*>', '', s, flags=re.I)
              return s.replace('</head>', '<script src="/site-global.js?v=20260911"></script></head>', 1)
          update('coming_soon.html', coming)

          def home(s):
              s=re.sub(r'<nav\b[^>]*\baria-label=["\']Primary navigation["\'][^>]*>.*?</nav>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<div\b[^>]*\bid=["\']sideMenu["\'][^>]*>.*?(?=<section\b[^>]*\bid=["\']home["\'])', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<header(?![^>]*data-ls-header)[^>]*>.*?</header>', '', s, flags=re.I|re.S)
              s=re.sub(r'<footer(?![^>]*data-ls-footer)[^>]*>.*?</footer>', '', s, flags=re.I|re.S)
              s=re.sub(r'<script[^>]+src=["\'][^"\']*homepage-final-fixes\.js[^"\']*["\'][^>]*>\s*</script>', '', s, flags=re.I)
              s=re.sub(r'<video\b[^>]*\bid=["\']bgVideo["\'][^>]*>.*?</video>', '', s, count=1, flags=re.I|re.S)
              s=re.sub(r'<script[^>]+src=["\']/site-global\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', '', s, flags=re.I)
              return s.replace('</head>', '<script src="/site-global.js?v=20260911"></script></head>', 1)
          update('index.html', home)

          update('releases.html', lambda s: s.replace("'somewhere_in_between.jpg'", "'57_lil_synn_somewhere_in_between.jpg'"))

          def css(s):
              s=s.replace('var(--glow)', 'var(--ls-glow)')
              s=re.sub(r'\.ls-brand-stack\{[^}]*\}', '', s)
              s=re.sub(r'\.ls-brand\{[^}]*\}', '', s)
              s=re.sub(r'\.ls-brand img\{[^}]*\}', '', s)
              s=s.replace('.ls-header .ls-brand{display:none!important}', '')
              s=s.replace('.ls-header .ls-footer{padding-bottom:28px}', '.ls-footer{padding-bottom:28px}')
              s=s.replace("background-image:url('/assets/images/icons/LS_HEADPHONES.png');background-repeat:no-repeat;background-position:center;background-size:64px 64px;", '')
              return s
          update('site-global.css', css)

          def script(s):
              pattern=r"const releaseFix=\(\)=>\{.*?\};const videoOrder="
              replacement="const releaseFix=()=>{const root=document.querySelector('.release-page #releases');if(!root)return;let running=false;let observer;const run=()=>{if(running)return;running=true;observer.disconnect();reorderReleases().finally(()=>{running=false;observer.observe(root,{childList:true})})};observer=new MutationObserver(run);observer.observe(root,{childList:true});run()};const videoOrder="
              return re.sub(pattern,replacement,s,count=1,flags=re.S)
          update('script.js', script)

          update('latest-videos.json', lambda s: s)

      - name: Generate WebM manifest
        if: github.event_name == 'push'
        shell: python
        run: |
          import json
          from pathlib import Path
          files=sorted([p.name for p in Path('assets/mov').glob('*.webm') if p.is_file()], key=str.lower)
          Path('assets/mov/index.json').write_text(json.dumps(files, indent=2)+'\n', encoding='utf-8')

      - name: Commit repairs
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize site shell and repair regressions'
          git push

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f special_access.html
          test -f coming_soon.html
          test -f privacy.html
          test -f terms.html
          test -f releases.html
          test -f site-global.css
          test -f site-global.js
          test -f script.js
          test -f music-random.js
          test -f latest-videos.js
          test -f release-catalog.json
          test -f assets/mov/LS_BG_STARS.webm
          test -f assets/mov/index.json
          test -f assets/images/icons/LS_LOGO.png
          test -f assets/images/icons/LS_HEADPHONES.png
          test -f assets/images/icons/UP_ARROWS.png
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='*.md' 'assets/mov/BG2.webm' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='*.md' 'assets/mov/BG_ANI.webm' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --include='*.html' 'id="sideMenu"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --include='*.html' 'aria-label="Primary navigation"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --include='*.html' 'homepage-final-fixes.js' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --include='*.html' 'class="nav"' .
          grep -q '/site-global.js' index.html
          grep -q '/site-global.js' special_access.html
          grep -q 'rel="canonical" href="https://lilsynn.com/releases.html"' releases.html
          grep -q 'rel="canonical" href="https://lilsynn.com/special_access.html"' special_access.html
          grep -q 'name="description"' special_access.html

      - name: Validate release catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('release-catalog.json').read_text(encoding='utf-8'))
          expected=['Never Known','HOME (ACOUSTIC VERSION)','I DID IT AGAIN']
          assert data.get('order',[])[:3]==expected
          assert all(data.get('spotify',{}).get(t) and data.get('apple',{}).get(t) for t in expected)
          assert 'Touching to the North' in data.get('groups',{})
          print('Release catalog validation passed.')
          PY
