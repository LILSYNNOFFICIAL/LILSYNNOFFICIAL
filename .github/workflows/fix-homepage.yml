name: Validate and clean homepage architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize homepage shell and background
        if: github.event_name == 'push'
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); original=s
          s=re.sub(r'<nav\b[^>]*\baria-label=["\']Primary navigation["\'][^>]*>.*?</nav>','',s,count=1,flags=re.I|re.S)
          s=re.sub(r'<div\b[^>]*\bid=["\']sideMenu["\'][^>]*>.*?(?=<section\b[^>]*\bid=["\']home["\'])','',s,count=1,flags=re.I|re.S)
          s=re.sub(r'<header(?![^>]*data-ls-header)[^>]*>.*?</header>','',s,flags=re.I|re.S)
          s=re.sub(r'<footer(?![^>]*data-ls-footer)[^>]*>.*?</footer>','',s,flags=re.I|re.S)
          s=re.sub(r'<script[^>]+src=["\'][^"\']*homepage-final-fixes\.js[^"\']*["\'][^>]*>\s*</script>','',s,flags=re.I)
          s=re.sub(r'<video\b[^>]*\bid=["\']bgVideo["\'][^>]*>.*?</video>','',s,count=1,flags=re.I|re.S)
          legacy=[r':root\s*\{\s*--nav-height\s*:\s*72px\s*;\s*--nav-gap\s*:\s*0\.5rem\s*;\s*\}',r'#home\s*\{[^}]*padding-top:\s*calc\(var\(--nav-height\).*?\}',r'#bgVideo\s*\{[^}]*top:\s*var\(--nav-height\)[^}]*\}',r'\.video-gradient-overlay\s*\{\s*z-index:\s*5;\s*pointer-events:\s*none;\s*\}',r'section\s*\{\s*position:\s*relative;\s*z-index:\s*10;\s*\}',r'#sideMenu[^}]*\}',r'\.site-headphones[^}]*\}',r'@media\(max-width:640px\)\{nav \.flex\.items-center \.text-4xl\{.*?\}\s*nav \.max-w-7xl\{.*?\}\}']
          for pattern in legacy:s=re.sub(pattern,'',s,flags=re.I|re.S)
          s=re.sub(r'<script[^>]+src=["\']/site-global\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',s,flags=re.I)
          s=s.replace('</head>','<script src="/site-global.js?v=20260911"></script></head>',1)
          if s!=original:p.write_text(s,encoding='utf-8')

      - name: Normalize Special Access shell and SEO
        if: github.event_name == 'push'
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path('special_access.html'); s=p.read_text(encoding='utf-8'); original=s
          s=re.sub(r'<video\b[^>]*\bid=["\']bg["\'][^>]*>.*?</video>','',s,count=1,flags=re.I|re.S)
          s=re.sub(r'<div\b[^>]*\bid=["\']ov["\'][^>]*>.*?</div>','',s,count=1,flags=re.I|re.S)
          s=re.sub(r'<nav\b[^>]*\bclass=["\'][^"\']*\bnav\b[^"\']*["\'][^>]*>.*?</nav>','',s,count=1,flags=re.I|re.S)
          s=re.sub(r'<div\b[^>]*\bid=["\']menu["\'][^>]*>.*?(?=<header\b[^>]*\bclass=["\'][^"\']*\bhero\b)','',s,count=1,flags=re.I|re.S)
          s=re.sub(r'<footer\b[^>]*\bclass=["\'][^"\']*site-footer[^"\']*["\'][^>]*>.*?</footer>','',s,flags=re.I|re.S)
          s=re.sub(r'<link[^>]+rel=["\']canonical["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'<meta[^>]+name=["\']description["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'<link[^>]+href=["\']/site-global\.css(?:\?[^"\']*)?["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'<script[^>]+src=["\']/site-global\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>','',s,flags=re.I)
          head='<meta name="description" content="LIL SYNN Special Access archive for exclusive recordings, alternate versions, visuals, and unreleased material."><link rel="canonical" href="https://lilsynn.com/special_access.html"><link rel="stylesheet" href="/site-global.css?v=20260911"><script src="/site-global.js?v=20260911"></script>'
          s=s.replace('</head>',head+'</head>',1)
          if s!=original:p.write_text(s,encoding='utf-8')

      - name: Retire obsolete homepage fixer
        if: github.event_name == 'push'
        shell: bash
        run: rm -f homepage-final-fixes.js

      - name: Generate randomized WebM manifest
        if: github.event_name == 'push'
        shell: python
        run: |
          import json
          from pathlib import Path
          videos=sorted([p.name for p in Path('assets/mov').glob('*.webm') if p.is_file()],key=str.lower)
          Path('assets/mov/index.json').write_text(json.dumps(videos,indent=2)+'\n',encoding='utf-8')
          print(f'Indexed {len(videos)} WebM background videos.')

      - name: Commit source cleanup and media manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source cleanup or video manifest changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize global shell and background video architecture'
          git push

      - name: Validate required source and media assets
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f special_access.html
          test -f style.css
          test -f script.js
          test -f site-polish.js
          test -f music-random.js
          test -f latest-videos.js
          test -f release-catalog.json
          test -f sitemap.xml
          test -f assets/mov/index.json
          test -f assets/mov/LG_BG_STARS.webm
          test -f assets/images/icons/LS_HEADPHONES.png
          test -f assets/images/icons/UP_ARROWS.png
          test -f "assets/images/icons/album_art/Never Known_album_cover.jpg"
          test -f "assets/images/icons/album_art/home_acoustic_version.png"
          test -f "assets/images/icons/album_art/I DID IT AGAIN.jpg"

      - name: Reject obsolete shell and media references
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'aria-label="Primary navigation"' index.html
          ! grep -q 'id="sideMenu"' index.html
          ! grep -q 'class="site-headphones"' index.html
          ! grep -q 'assets/img/LS_HEADPHONES.png' index.html
          ! grep -q 'homepage-final-fixes.js' index.html
          ! grep -q 'id="bgVideo"' index.html
          ! grep -q 'class="nav"' special_access.html
          ! grep -q 'id="menu"' special_access.html
          ! grep -q 'id="bg"' special_access.html
          ! grep -q 'class="site-footer"' special_access.html
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='*.md' 'assets/mov/BG2.webm' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='*.md' 'assets/mov/BG_ANI.webm' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --include='*.html' 'aria-label="Primary navigation"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --include='*.html' 'id="sideMenu"' .

      - name: Validate universal shell references
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o '/site-global.js' index.html | wc -l)" -eq 1
          grep -q '/site-global.js' special_access.html

      - name: Validate releases canonical URL
        shell: bash
        run: grep -q 'rel="canonical" href="https://lilsynn.com/releases.html"' releases.html

      - name: Validate Special Access SEO
        shell: bash
        run: |
          grep -q 'rel="canonical" href="https://lilsynn.com/special_access.html"' special_access.html
          grep -q 'name="description"' special_access.html

      - name: Validate sitemap coverage
        shell: bash
        run: |
          grep -q 'https://lilsynn.com/' sitemap.xml
          grep -q 'https://lilsynn.com/releases.html' sitemap.xml
          grep -q 'https://lilsynn.com/special_access.html' sitemap.xml
          grep -q 'https://lilsynn.com/privacy.html' sitemap.xml
          grep -q 'https://lilsynn.com/terms.html' sitemap.xml

      - name: Validate release catalog JSON
        shell: bash
        run: python3 -c "import json; from pathlib import Path; data=json.loads(Path('release-catalog.json').read_text(encoding='utf-8')); expected=['Never Known','HOME (ACOUSTIC VERSION)','I DID IT AGAIN']; assert data.get('order',[])[:3]==expected; assert all(data.get('spotify',{}).get(t) and data.get('apple',{}).get(t) for t in expected); assert 'Touching to the North' in data.get('groups',{}); print('Canonical release catalog validation passed.')"
