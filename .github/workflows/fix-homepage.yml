name: Validate homepage architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize obsolete background and canonical references
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for file in *.html; do
            if grep -q 'assets/mov/BG2.webm' "$file"; then
              sed -i 's#assets/mov/BG2.webm#assets/mov/BG_ANI.webm#g' "$file"
              changed=1
            fi
          done
          if [ -f releases.html ] && grep -q 'https://lilsynn.com/releases"' releases.html; then
            sed -i 's#https://lilsynn.com/releases"#https://lilsynn.com/releases.html"#g' releases.html
            changed=1
          fi
          if [ "$changed" -eq 1 ]; then
            git config user.name 'LIL SYNN Website Bot'
            git config user.email 'lilsynn89@gmail.com'
            git add '*.html'
            git commit -m 'fix: normalize legacy background and release canonical references'
            git push
          fi

      - name: Validate required source and media assets
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f script.js
          test -f site-polish.js
          test -f homepage-final-fixes.js
          test -f music-random.js
          test -f latest-videos.js
          test -f release-catalog.json
          test -f assets/mov/BG_ANI.webm
          test -f assets/mov/HERO_BG_WEBM.webm
          test -f assets/images/icons/album_art/Never\ Known_album_cover.jpg
          test -f assets/images/icons/album_art/home_acoustic_version.png
          test -f assets/images/icons/album_art/I\ DID\ IT\ AGAIN.jpg
          echo "Required homepage architecture and canonical media assets are present."

      - name: Reject obsolete BG2 references after normalization
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --exclude='*.md' 'assets/mov/BG2.webm' .; then
            echo 'ERROR: BG2.webm is not a repository asset and must not be referenced by source.'
            exit 1
          fi

      - name: Validate releases canonical URL
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rel="canonical" href="https://lilsynn.com/releases.html"' releases.html

      - name: Validate release catalog JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('release-catalog.json').read_text(encoding='utf-8'))
          expected = ['Never Known', 'HOME (ACOUSTIC VERSION)', 'I DID IT AGAIN']
          assert data.get('order', [])[:3] == expected, data.get('order', [])[:3]
          for title in expected:
              assert data.get('spotify', {}).get(title), f'Missing Spotify URL for {title}'
              assert data.get('apple', {}).get(title), f'Missing Apple Music URL for {title}'
          print('Canonical release catalog validation passed.')
          PY
