name: Validate canonical site architecture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vote.html
          test -f releases.html
          test -f archive.html
          test -f release.html
          test -f gallery.html
          test -f universe.html
          test -f special_access.html
          test -f coming_soon.html
          test -f privacy.html
          test -f terms.html
          test -f videos.html
          test -f site-shell.js
          test -f site-shell.css
          test -f index-enhancements.js
          test -f index-release-limit.js
          test -f release-catalog.json
          test -f assets/mov/LS_BG_STARS.webm
          test -f assets/mov/index.json
          ! test -f site-global.js
          ! test -f site-global.css
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --exclude='*.md' 'site-global.js' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --exclude='*.md' 'site-global.css' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --include='*.html' 'id="sideMenu"' .
          ! grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude-dir=Suno --include='*.html' 'class="nav"' .
          ! grep -q 'HERO_BG_WEBM.webm' index.html
          ! grep -q 'class="hero-webm"' index.html
          ! grep -q 'class="hero-stars"' index.html
          grep -q '/homepage-final-fix.js' index.html
          grep -q 'index-enhancements.js' index.html
          grep -q 'index-release-limit.js' index.html
          grep -q 'LS_BG_STARS.webm' site-shell.js
          grep -q 'document.body.appendChild(m)' site-shell.js
          grep -q 'site-shell.js' vote.html

      - name: Validate release catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('release-catalog.json').read_text(encoding='utf-8'))
          order=data.get('order',[])
          assert order, 'release catalog order is empty'
          assert len(set(order)) == len(order), 'duplicate release order entries'
          assert order[:3] == ['Never Known','HOME (ACOUSTIC VERSION)','I DID IT AGAIN']
          print('Release catalog validation passed.')
          PY

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check site-shell.js
          node --check index-enhancements.js
          node --check index-release-limit.js
          node scripts/test-homepage-final-fix.mjs
          node scripts/test-vote-page.mjs
          node scripts/test-site-shell.mjs
          node command/designer-dom-model.test.js
          node command/designer.test.js

      - name: Final mutation guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --include='*.yml' --include='*.yaml' 'git push origin HEAD:main\|git commit' .github/workflows; then
            echo 'Workflow mutation guard failed: CI must validate, not push.'
            exit 1
          fi
          echo 'Validation workflow is read-only.'
