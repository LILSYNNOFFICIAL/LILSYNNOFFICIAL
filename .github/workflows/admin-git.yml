name: ADMIN Git Operation
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'revert or restore'
        required: true
        type: choice
        options: [revert, restore]
      target_sha:
        description: 'Target commit SHA'
        required: true
        type: string
      branch:
        description: 'Branch'
        required: true
        default: main
        type: string
      actor:
        description: 'Admin audit actor'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-git.yml'
      - '.universe-image-fix'
permissions:
  contents: write
jobs:
  git-operation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply operation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LIL SYNN ADMIN"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch origin "${{ inputs.branch }}" --prune
          if [[ "${{ inputs.operation }}" == "revert" ]]; then
            git revert --no-edit "${{ inputs.target_sha }}"
          elif [[ "${{ inputs.operation }}" == "restore" ]]; then
            git reset --hard "${{ inputs.target_sha }}"
          else
            echo "Unsupported operation" >&2
            exit 1
          fi
          git push origin "HEAD:${{ inputs.branch }}"
      - name: Summary
        run: |
          echo "ADMIN operation=${{ inputs.operation }} target=${{ inputs.target_sha }} branch=${{ inputs.branch }} actor=${{ inputs.actor }}" >> "$GITHUB_STEP_SUMMARY"

  universe-image-fix:
    if: github.event_name == 'push' && github.event.head_commit.message != 'chore: apply universe image replacements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Replace album artwork references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '/assets/heal2.png': '/assets/img/Image 2 - About page portrait.png',
              '/assets/heal.jpg': '/assets/img/Image 3 - Universe key art.png',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected image reference: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name "LIL SYNN BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: apply universe image replacements"
          git push origin main
