name: Add randomized Music script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    if: "!contains(github.event.head_commit.message, 'Add randomized Music script to homepage')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add script tag to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="music-random.js"></script>'
          if tag not in s:
              s = s.replace('<script src="site-polish.js"></script>', '<script src="site-polish.js"></script>\n' + tag)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add randomized Music script to homepage'
          git push
