name: Suno Platform Validation

on:
  push:
    branches: [main]
    paths:
      - 'Suno/**'
      - 'scripts/sync-suno-guide.mjs'
      - 'scripts/build-suno-topics.mjs'
      - 'scripts/build-suno-index.mjs'
      - 'scripts/upgrade-suno-shell.mjs'
      - 'scripts/upgrade-suno-tools.mjs'
      - 'scripts/inject-suno-forum.mjs'
      - 'scripts/audit-suno-forum.mjs'
      - 'scripts/audit-suno-drafts.mjs'
      - 'scripts/audit-suno-site.mjs'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/suno-platform.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and audit Suno platform
        run: npm run build
