name: Inject shared site-global behavior

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-site-global:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add shared site-global script to every HTML page
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('/site-global.js?v=20260906', '/site-global.js?v=20260907')
              if '/site-global.js' not in text:
                  marker = '</body>'
                  if marker not in text.lower():
                      continue
                  idx = text.lower().rfind(marker)
                  text = text[:idx] + '<script src="/site-global.js?v=20260907" defer></script>\n' + text[idx:]
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Bump shared site-global cache version"
          git push
