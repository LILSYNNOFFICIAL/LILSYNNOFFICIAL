name: Fix homepage merch artwork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Fix homepage merch artwork')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace merch square with supplied artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site-polish.js')
          s = p.read_text()

          old_css = ".merch-signal-art{min-height:220px;border-radius:1.5rem;border:1px solid rgba(255,0,143,.25);background:radial-gradient(circle at 30% 30%,rgba(255,0,143,.32),transparent 45%),radial-gradient(circle at 70% 70%,rgba(255,79,216,.16),transparent 45%),#050505;display:grid;place-items:center;overflow:hidden}\n .merch-signal-art span{font:700 clamp(1.4rem,4vw,2.5rem) Orbitron,sans-serif;letter-spacing:.18em;color:#fff;text-align:center;text-shadow:0 0 20px rgba(255,0,143,.55)}"
          new_css = ".merch-signal-art{display:flex;align-items:center;justify-content:center;min-height:0;border:0;background:transparent;overflow:hidden;text-decoration:none}\n .merch-signal-art img{display:block;width:min(100%,520px);height:auto;max-height:280px;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,.35));transition:transform .2s ease,filter .2s ease}\n .merch-signal-art:hover img,.merch-signal-art:focus-visible img{transform:scale(1.02);filter:drop-shadow(0 12px 32px rgba(255,0,143,.18))}\n .merch-signal-art span{display:none}"
          old_html = 'entrance.innerHTML=\'<div class="merch-panel"><h3>WEAR THE SIGNAL</h3><p>Official LIL SYNN merchandise — built for the people inside the signal.</p></div><div class="merch-signal-art" aria-hidden="true"><span>LIL SYNN<br>MERCH</span></div>\';'
          new_html = 'entrance.innerHTML=\'<div class="merch-panel"><h3>WEAR THE SIGNAL</h3><p>Official LIL SYNN merchandise — built for the people inside the signal.</p></div><a class="merch-signal-art" href="https://lilsynnofficial.threadless.com/" target="_blank" rel="noopener noreferrer" aria-label="Shop official LIL SYNN merchandise"><img src="assets/img/MERCH_SHOP.png" alt="LIL SYNN official merchandise" loading="lazy" decoding="async"></a>\';'

          if old_css not in s:
              raise SystemExit('Expected merch CSS block was not found; refusing to modify file.')
          if old_html not in s:
              raise SystemExit('Expected merch HTML block was not found; refusing to modify file.')
          s = s.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
          p.write_text(s)
          PY
      - name: Commit fix on current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add site-polish.js
          git diff --cached --quiet && exit 0
          git commit -m "Replace homepage merch square with artwork [skip ci]"
          git push origin HEAD:main
      - name: Remove one-time fixer workflow
        if: success()
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/fix-homepage-merch.yml
          git commit -m "Remove one-time merch fixer [skip ci]"
          git push origin HEAD:main
