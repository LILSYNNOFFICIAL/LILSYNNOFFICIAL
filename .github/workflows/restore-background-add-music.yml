name: One-time background restore and music
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Restore original background and add homepage music'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore background and add music
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/mov/BG2.webm', 'assets/mov/lv_0_20260718234757.mp4')
          marker = '</body>'
          audio = '''<audio id="bgMusic" loop preload="auto" aria-hidden="true"></audio>\n<script>\n(function(){\n  const a=document.getElementById('bgMusic');\n  const b='YXNzZXRzL290aGVyL3NvdW5kL0JhY2tncm91bmQubXAz';\n  const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));\n  a.src=new TextDecoder().decode(bytes);\n  const start=()=>{a.play().catch(()=>{});};\n  document.addEventListener('pointerdown',start,{once:true,passive:true});\n  document.addEventListener('keydown',start,{once:true});\n})();\n</script>\n'''
          if 'id="bgMusic"' not in s:
              s=s.replace(marker,audio+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "LIL SYNN Website Bot"
          git config user.email "lilsynn89@gmail.com"
          rm -f .github/workflows/restore-background-add-music.yml
          git add index.html .github/workflows/restore-background-add-music.yml
          git commit -m "Restore original background and add homepage music"
          git push
