name: RERUN ALL JOBS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/RERUN ALL JOBS.yml'

permissions:
  actions: write
  contents: read

jobs:
  rerun-all-workflows:
    name: Process current main state
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Process every runnable workflow against current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_WORKFLOW: RERUN ALL JOBS
          BRANCH: main
          START_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_run() {
            local run_id="$1"
            local label="$2"
            local status=""
            local conclusion=""

            for _ in $(seq 1 180); do
              status=$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)
              conclusion=$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.conclusion // empty' 2>/dev/null || true)
              echo "[$label] run=$run_id status=${status:-unknown} conclusion=${conclusion:-pending}"

              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ]
                return
              fi
              sleep 10
            done

            echo "[$label] timed out waiting for run $run_id"
            return 1
          }

          echo "=========================================="
          echo "        RERUN ALL JOBS"
          echo "=========================================="
          echo "Repository: $REPO"
          echo "Starting SHA: $START_SHA"
          echo

          workflows=$(gh api --paginate \
            "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .name, .path, .state] | @tsv' | sort -t $'\t' -k3,3)

          total=0
          dispatched=0
          completed=0
          failed=0
          skipped=0

          while IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state; do
            [ -z "$workflow_id" ] && continue
            total=$((total + 1))

            echo
            echo "------------------------------------------"
            echo "Workflow: $workflow_name"
            echo "Path:     $workflow_path"
            echo "State:    $workflow_state"

            if [ "$workflow_name" = "$CURRENT_WORKFLOW" ]; then
              echo "SKIPPED: controller workflow"
              skipped=$((skipped + 1))
              continue
            fi

            if [[ "$workflow_state" == disabled_* ]]; then
              echo "SKIPPED: workflow is disabled"
              skipped=$((skipped + 1))
              continue
            fi

            encoded=$(gh api \
              "repos/$REPO/contents/$workflow_path?ref=$BRANCH" \
              --jq '.content' 2>/dev/null | tr -d '\n' || true)

            if [ -z "$encoded" ]; then
              echo "SKIPPED: workflow definition is no longer readable on main"
              skipped=$((skipped + 1))
              continue
            fi

            workflow_yaml=$(printf '%s' "$encoded" | base64 --decode)

            if printf '%s\n' "$workflow_yaml" | grep -Eq '^[[:space:]]+workflow_dispatch:'; then
              if printf '%s\n' "$workflow_yaml" | awk '
                /^  workflow_dispatch:/ {inside=1; next}
                inside && /^[^[:space:]]/ {inside=0}
                inside && /required:[[:space:]]*true/ {found=1}
                END {exit(found ? 0 : 1)}
              '; then
                echo "SKIPPED: workflow_dispatch requires manual inputs"
                skipped=$((skipped + 1))
                continue
              fi

              echo "DISPATCH: current main"
              if ! gh api --method POST \
                "repos/$REPO/actions/workflows/$workflow_id/dispatches" \
                -f ref="$BRANCH" >/dev/null; then
                echo "FAILED: workflow_dispatch request"
                failed=$((failed + 1))
                continue
              fi

              dispatched=$((dispatched + 1))
              run_id=""

              # GitHub's dispatch endpoint returns no run ID. Because this
              # controller dispatches sequentially, the newest workflow_dispatch
              # run for this workflow/branch is the run just created.
              for _ in $(seq 1 30); do
                run_id=$(gh api \
                  "repos/$REPO/actions/workflows/$workflow_id/runs?branch=$BRANCH&event=workflow_dispatch&per_page=10" \
                  --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)
                [ -n "$run_id" ] && break
                sleep 2
              done

              if [ -z "$run_id" ]; then
                echo "FAILED: could not locate newly dispatched run"
                failed=$((failed + 1))
                continue
              fi

              echo "RUN: $run_id"
              if wait_for_run "$run_id" "$workflow_name"; then
                echo "SUCCESS: workflow completed"
                completed=$((completed + 1))
              else
                echo "FAILED: workflow run $run_id"
                failed=$((failed + 1))
              fi
              continue
            fi

            current_run=$(gh api \
              "repos/$REPO/actions/workflows/$workflow_id/runs?branch=$BRANCH&head_sha=$START_SHA&per_page=10" \
              --jq '.workflow_runs | .[0].id // empty' 2>/dev/null || true)

            if [ -z "$current_run" ]; then
              echo "SKIPPED: no invocation for current main SHA"
              skipped=$((skipped + 1))
              continue
            fi

            run_status=$(gh api "repos/$REPO/actions/runs/$current_run" --jq '.status' 2>/dev/null || true)
            echo "CURRENT RUN: $current_run ($run_status)"

            if [ "$run_status" != "completed" ]; then
              echo "WAIT: current-SHA workflow is already running"
              if wait_for_run "$current_run" "$workflow_name"; then
                completed=$((completed + 1))
              else
                failed=$((failed + 1))
              fi
              continue
            fi

            run_conclusion=$(gh api "repos/$REPO/actions/runs/$current_run" --jq '.conclusion // empty' 2>/dev/null || true)

            if [ "$run_conclusion" = "success" ]; then
              echo "SUCCESS: current-SHA workflow already completed successfully"
              completed=$((completed + 1))
              continue
            fi

            echo "RERUN: completed current-SHA run $current_run ($run_conclusion)"
            if gh api --method POST "repos/$REPO/actions/runs/$current_run/rerun" >/dev/null; then
              if wait_for_run "$current_run" "$workflow_name"; then
                completed=$((completed + 1))
              else
                failed=$((failed + 1))
              fi
            else
              failed=$((failed + 1))
            fi

          done <<< "$workflows"

          echo
          echo "=========================================="
          echo "                 SUMMARY"
          echo "=========================================="
          echo "Workflows found:       $total"
          echo "Dispatched:            $dispatched"
          echo "Completed/verified:    $completed"
          echo "Failed:                $failed"
          echo "Skipped:               $skipped"
          echo "Final main SHA:        $(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          echo "=========================================="

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
