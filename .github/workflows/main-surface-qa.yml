name: Main Surface QA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-surface-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Site Doctor
        id: site_doctor
        shell: bash
        run: |
          set +e
          node tools/site-doctor.mjs 2>&1 | tee /tmp/site-doctor.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Start production-routing QA server
        run: |
          nohup node tools/qa-server.mjs > /tmp/lilsynn-http.log 2>&1 </dev/null &
          echo $! > /tmp/lilsynn-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4173/command/ >/dev/null && curl -fsS http://127.0.0.1:4173/command/admin/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lilsynn-http.log
          exit 1

      - name: Run Main / Command / Admin / Suno browser QA
        id: browser_qa
        shell: bash
        env:
          CI: 'true'
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          QA_BASE_URL: http://127.0.0.1:4173
        run: |
          set +e
          node tools/main-surface-qa.mjs 2>&1 | tee /tmp/main-surface-qa.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Determine QA status
        id: status
        shell: bash
        run: |
          site_doctor='${{ steps.site_doctor.outputs.status }}'
          browser_qa='${{ steps.browser_qa.outputs.status }}'
          if [ "$site_doctor" = "0" ] && [ "$browser_qa" = "0" ]; then
            overall=PASS
          else
            overall=FAIL
          fi

          extract_status() {
            local key="$1"
            local value
            value=$(grep -E "^${key}=(PASS|FAIL)$" /tmp/main-surface-qa.log | tail -1 | cut -d= -f2)
            printf '%s' "${value:-FAIL}"
          }

          main_status=$(extract_status QA_MAIN)
          command_status=$(extract_status QA_COMMAND)
          admin_status=$(extract_status QA_ADMIN)
          suno_status=$(extract_status QA_SUNO)

          if [ "$site_doctor" != "0" ]; then main_status=FAIL; fi

          {
            echo "overall=$overall"
            echo "main=$main_status"
            echo "command=$command_status"
            echo "admin=$admin_status"
            echo "suno=$suno_status"
          } >> "$GITHUB_OUTPUT"

      - name: Upload QA artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-surface-qa-${{ github.sha }}
          path: |
            /tmp/main-surface-qa.log
            /tmp/site-doctor.log
            /tmp/lilsynn-http.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail workflow when QA fails
        if: ${{ steps.status.outputs.overall == 'FAIL' }}
        run: exit 1
