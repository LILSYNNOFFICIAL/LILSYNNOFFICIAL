name: Sync complete Suno guide into website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-suno-guide.yml'
      - 'scripts/rebuild-suno-central.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch complete source guide
        run: git clone --depth 1 https://github.com/LILSYNNOFFICIAL/LIL-SYNN-s-Complete-Suno-V6-Guide.git /tmp/suno-guide
      - name: Install Markdown renderer
        run: python -m pip install markdown
      - name: Rebuild central guide from every source document
        run: python scripts/rebuild-suno-central.py /tmp/suno-guide .
      - name: Verify central guide output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('Suno')
          m=json.loads((root/'content/manifest.json').read_text())
          assert len(m['documents']) >= 9, len(m['documents'])
          assert 'FIX AUDIO QUALITY' in (root/'index.html').read_text()
          assert (root/'audio_fix_v6/index.html').exists()
          for d in m['documents']:
              assert (root/d['html']).exists(), d['html']
          idx=Path('index2-final-fix.js').read_text()
          assert 'top:-170px!important' in idx
          assert 'LS_BG_STARS.webm' in idx
          print(f"Verified {len(m['documents'])} complete guide documents")
          PY
      - name: Commit generated guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Suno index2-final-fix.js
          git commit -m 'rebuild: centralize complete Suno V6 guide' || exit 0
          git push
