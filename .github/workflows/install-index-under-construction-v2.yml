name: Install index under-construction overlay v2
on:
  push:
    branches: [main]
    paths:
      - index-under-construction-v2.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure index loads the overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="/index-under-construction-v2.js" defer></script>'
          if tag not in text:
              text=text.replace('</head>', tag+'\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit injected script tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Overlay script tag already installed.'
            exit 0
          fi
          git commit -m 'feat: wire index under-construction overlay'
          git push
