name: Designer Smoke

on:
  push:
    branches: [main]
    paths:
      - 'command/designer.html'
      - 'command/designer.css'
      - 'command/designer.js'
      - 'command/designer.test.js'
      - 'api/admin.js'
      - '.github/workflows/designer-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check command/designer.js && node --check api/admin.js
      - name: Contract test
        run: node command/designer.test.js
