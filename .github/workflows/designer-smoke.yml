name: Designer Smoke

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'command/designer.html'
      - 'command/designer.css'
      - 'command/designer.js'
      - 'command/designer-plus.js'
      - 'command/designer-assets.js'
      - 'command/designer-structure.js'
      - 'command/designer-dom-model.js'
      - 'command/designer-dom-model.test.js'
      - 'command/designer-persist.js'
      - 'command/designer-advanced.js'
      - 'command/designer.test.js'
      - 'api/admin.js'
      - 'api/designer-dom.js'
      - '.github/workflows/designer-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check command/designer.js && node --check command/designer-plus.js && node --check command/designer-assets.js && node --check command/designer-structure.js && node --check command/designer-dom-model.js && node --check command/designer-persist.js && node --check command/designer-advanced.js && node --check api/admin.js && node --check api/designer-dom.js
      - name: Structural model test
        run: node command/designer-dom-model.test.js
      - name: Designer contract test
        run: node command/designer.test.js
