name: One-time site link update
on:
  push:
    branches: [site-links-work]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch requested links
        shell: python
        run: |
          from pathlib import Path

          snippet = r'''<script>
          (()=>{
            const add=()=>{
              if(document.querySelector('[data-ls-official-bottom]')) return;
              const wrap=document.createElement('div');
              wrap.dataset.lsOfficialBottom='true';
              wrap.style.cssText='position:relative;z-index:100;padding:18px 16px 28px;text-align:center;background:#020204;border-top:1px solid rgba(255,0,143,.18);font-family:Rajdhani,Arial,sans-serif;';
              wrap.innerHTML='<a href="/Suno" style="display:inline-block;margin:0 8px 8px;color:#ff4fd8;text-decoration:none;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px">Suno V6 Guide</a><span style="color:rgba(255,255,255,.2)">·</span><a href="https://lilsynn.com" style="display:inline-block;margin:0 8px;color:#fff;text-decoration:none;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px">LIL SYNN OFFICIAL SITE</a>';
              document.body.appendChild(wrap);
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',add,{once:true}); else add();
          })();
          </script>'''

          for name in ('index.html','index2.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'data-ls-official-bottom' not in s:
                  marker='</body>'
                  if marker not in s: raise SystemExit(f'Missing </body> in {name}')
                  s=s.replace(marker, snippet+'\n'+marker, 1)
                  p.write_text(s, encoding='utf-8')

          p=Path('Suno/complete/complete-guide.html')
          s=p.read_text(encoding='utf-8')
          if 'LIL SYNN OFFICIAL SITE' not in s:
              image_block=r'''<section class="official-site-card" aria-label="LIL SYNN official site">
          <a href="https://lilsynn.com" class="official-site-image-link" aria-label="Visit the LIL SYNN official site">
            <img src="/assets/img/LS.png" alt="LIL SYNN">
            <span>LIL SYNN OFFICIAL SITE</span>
          </a>
          </section>'''
              footer=r'''<footer class="official-site-footer"><a href="https://lilsynn.com">LIL SYNN OFFICIAL SITE</a></footer>'''
              css=r'''.official-site-card{max-width:520px;margin:44px auto 0;text-align:center}.official-site-image-link{display:block;color:#fff;text-decoration:none;border:1px solid rgba(255,20,147,.24);background:rgba(255,255,255,.025);padding:18px;transition:.22s}.official-site-image-link:hover{border-color:#ff1493;box-shadow:0 0 36px rgba(255,20,147,.12);transform:translateY(-2px)}.official-site-image-link img{display:block;width:100%;max-height:430px;object-fit:contain;margin:auto}.official-site-image-link span{display:block;margin-top:12px;color:#ff4fd8;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.official-site-footer{margin-top:70px;padding:24px 5vw 38px;text-align:center;border-top:1px solid rgba(255,255,255,.08)}.official-site-footer a{color:#ff4fd8;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}.official-site-footer a:hover{color:#fff}'''
              s=s.replace('</style>',css+'</style>',1)
              s=s.replace('<section class="guide-content">',image_block+'\n<section class="guide-content">',1)
              s=s.replace('</main>\n<script src="../js/suno.js"></script>', '</main>\n'+footer+'\n<script src="../js/suno.js"></script>',1)
              p.write_text(s, encoding='utf-8')

          wf=Path('.github/workflows/one-time-site-links.yml')
          wf.unlink()

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index2.html Suno/complete/complete-guide.html .github/workflows/one-time-site-links.yml
          git commit -m "Add Suno and official site footer links" || exit 0
          git push origin HEAD:site-links-work
