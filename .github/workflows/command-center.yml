name: LIL SYNN Command Center

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'command/**'
      - 'Suno/**'
      - 'vercel.json'
      - '.github/workflows/command-center.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'command/**'
      - 'Suno/**'
      - 'vercel.json'
      - '.github/workflows/command-center.yml'

permissions:
  contents: read

jobs:
  command-center:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Command Center + Suno route/content regression harness
        run: node admin/admin.test.mjs
      - name: Run isolated Suno test suite
        run: npm test --prefix Suno
