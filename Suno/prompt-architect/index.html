<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Architect — LIL SYNN Suno V6</title><link rel="stylesheet" href="/suno/css/suno.css"><style>body{margin:0;background:#070706;color:#f5f0e7;font-family:Inter,system-ui,sans-serif}.tool{max-width:1180px;margin:auto;padding:110px 5vw 80px}.ey{font:900 9px Rajdhani,sans-serif;letter-spacing:.24em;color:#f1cf78}.tool h1{font:400 clamp(48px,7vw,88px)/.9 Georgia,serif;margin:12px 0 18px}.tool h1 em{color:#f1cf78;font-style:normal}.lead{color:#a49c91;line-height:1.7;max-width:760px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}.panel{background:#0e0d0a;border:1px solid rgba(241,207,120,.18);padding:22px}.panel h2{font:400 27px Georgia,serif;color:#f1cf78;margin:0 0 15px}label{display:block;color:#8d857a;font:900 8px Rajdhani;letter-spacing:.16em;margin:14px 0 7px}textarea,input,select{box-sizing:border-box;width:100%;background:#070706;color:#eee8de;border:1px solid rgba(255,255,255,.12);padding:12px;font:13px/1.6 ui-monospace,monospace}textarea{min-height:130px}.out{white-space:pre-wrap;min-height:220px;background:#070706;border:1px solid rgba(241,207,120,.14);padding:15px;color:#ddd5ca}.btn{margin-top:14px;padding:12px 16px;border:1px solid rgba(241,207,120,.3);background:#11100d;color:#f1cf78;font:900 9px Rajdhani;letter-spacing:.15em;cursor:pointer}.nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.nav a{color:#f1cf78;text-decoration:none;font:900 9px Rajdhani;letter-spacing:.14em}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="tool"><div class="ey">LIL SYNN / SUNO V6 TOOL</div><h1>PROMPT <em>ARCHITECT.</em></h1><p class="lead">Build a structured Suno prompt from the elements you actually want to control. This is a working local tool, not a placeholder card.</p><div class="grid"><section class="panel"><h2>Build</h2><label>GENRE / CORE STYLE</label><input id="genre" placeholder="electropop, alternative pop"><label>VOCALS</label><input id="vocals" placeholder="intimate male vocal, breathy, controlled"><label>INSTRUMENTATION</label><textarea id="inst" placeholder="synth bass, analog pads, punchy drums..."></textarea><label>MOOD / ENERGY</label><input id="mood" placeholder="dark, emotional, driving"><label>PRODUCTION</label><textarea id="prod" placeholder="wide stereo image, crisp transients, clear separation..."></textarea><button class="btn" id="build">BUILD PROMPT</button></section><section class="panel"><h2>Result</h2><div id="out" class="out">Enter your elements and build the prompt.</div><button class="btn" id="copy">COPY PROMPT</button></section></div><div class="nav"><a href="/suno">← SUNO HOME</a><a href="/suno/library/">COMPLETE DOCUMENT LIBRARY</a><a href="/suno/controls/">CONTROLS</a></div></main><script>const v=id=>document.getElementById(id).value.trim();const out=document.getElementById('out');document.getElementById('build').onclick=()=>{out.textContent=[v('genre'),v('vocals'),v('inst'),v('mood'),v('prod')].filter(Boolean).join(', ')};document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(out.textContent);</script></body></html>
