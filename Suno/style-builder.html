<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIL SYNN — Style Builder</title><link rel="stylesheet" href="css/suno.css"><link rel="stylesheet" href="css/command-center.css"></head><body data-tool="style-builder"><header class="site-header"><div class="header-inner"><a class="brand" href="/suno"><span>LIL SYNN</span><b>SUNO V6</b></a><nav class="site-nav" id="site-nav"><a class="nav-complete" href="/suno/command-center">COMMAND CENTER</a><a class="nav-complete" href="/suno/styles">STYLE GUIDE</a></nav><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span><b>MENU</b></button></div></header><main class="tool-page"><header class="tool-head"><span class="command-kicker">02 / CREATE</span><h1>STYLE <em>BUILDER</em></h1><p>Construct a compact style direction around audible characteristics, identity and production behavior.</p></header><div class="tool-layout"><section class="tool-panel"><h2>Shape the sound</h2><div class="field-grid"><div class="field"><label>PRIMARY GENRE</label><input id="style-genre" placeholder="electropop"></div><div class="field"><label>SUBSTYLE</label><input id="style-sub" placeholder="alt-pop / synthwave"></div><div class="field"><label>ERA</label><input id="style-era" placeholder="modern 2020s"></div><div class="field"><label>MOOD</label><input id="style-mood" placeholder="melancholic, urgent"></div><div class="field"><label>VOCALS</label><input id="style-vocal" placeholder="intimate male lead, airy harmonies"></div><div class="field"><label>TEXTURE</label><input id="style-texture" placeholder="analog synth texture, wide pads"></div><div class="field full"><label>INSTRUMENTATION</label><div class="check-row"><label class="check"><input type="checkbox" name="style-instrument" value="analog synths"> Analog synths</label><label class="check"><input type="checkbox" name="style-instrument" value="sub bass"> Sub bass</label><label class="check"><input type="checkbox" name="style-instrument" value="electric guitar"> Electric guitar</label><label class="check"><input type="checkbox" name="style-instrument" value="piano"> Piano</label><label class="check"><input type="checkbox" name="style-instrument" value="punchy drums"> Punchy drums</label></div></div><div class="field full"><label>MIX / PRODUCTION</label><input id="style-mix" placeholder="tight low end, controlled dynamics, spacious chorus"></div></div><div class="tool-actions"><button class="button gold" id="generate-tool" type="button">BUILD STYLE →</button><button class="button ghost" id="reset-tool" type="button">RESET</button></div></section><section class="tool-panel tool-output"><div class="output-meta"><span>STYLE DIRECTION</span><span>CLIENT-SIDE</span></div><textarea id="tool-output" readonly placeholder="Your style block will appear here."></textarea><div class="tool-actions"><button class="button ghost" id="copy-output" type="button">COPY OUTPUT</button><a class="button ghost" href="/suno/styles">READ STYLE GUIDE</a></div></section></div></main><footer class="site-footer"><div><strong>LIL SYNN</strong><span> / STYLE BUILDER</span></div><a href="/suno/command-center">COMMAND CENTER ↗</a></footer><script src="js/suno.js"></script><script src="js/suno-tools.js"></script></body></html>
