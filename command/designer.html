<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIL SYNN — Visual Layout Editor</title>
<link rel="stylesheet" href="/command/designer.css?v=20260915">
</head>
<body>
<section id="login" class="login">
  <form id="loginForm" class="login-card">
    <h1>VISUAL EDITOR</h1>
    <p>LIL SYNN front-page design control. Sign in with your existing Command Center credentials.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">ENTER DESIGNER</button>
    <div id="loginError" class="error"></div>
  </form>
</section>
<div class="designer hidden">
  <header class="top">
    <div class="logo">LIL SYNN / DESIGNER</div><div class="route">/index.html</div>
    <div class="toolbar">
      <button class="tool" id="undo" title="Ctrl/Cmd+Z">↶ UNDO</button>
      <button class="tool" id="redo" title="Ctrl/Cmd+Y">↷ REDO</button>
      <select class="select" id="viewportSelect" aria-label="Viewport"><option value="desktop">DESKTOP</option><option value="tablet">TABLET</option><option value="mobile">MOBILE</option></select>
      <button class="tool" id="draft">SAVE DRAFT</button><button class="tool" id="loadDraft">LOAD</button>
      <button class="tool" id="codeToggle">CODE</button><button class="tool" id="preview">PREVIEW</button><button class="tool save" id="saveGithub">SAVE TO GITHUB</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="rail">
      <div class="rail-head"><div class="eyebrow">ELEMENTS / LAYERS</div><input id="layerSearch" class="search" placeholder="Search elements…"></div>
      <div id="layers"></div>
    </aside>
    <section class="canvas">
      <div class="stage-wrap"><div id="stage" class="stage"><iframe id="pageFrame" title="LIL SYNN front page editor preview"></iframe><div id="overlay" class="overlay"></div><div id="grid" class="grid-overlay hidden"></div></div></div>
      <div class="canvas-tools">
        <button class="tool active" data-tool="select">SELECT</button><button class="tool" data-tool="hand">HAND</button><button class="tool" id="gridToggle">GRID</button><button class="tool active" id="snapToggle">SNAP</button><button class="tool active" id="guideToggle">GUIDES</button><button class="tool optional" id="rulerToggle">RULERS</button>
      </div>
      <pre id="code" class="code hidden"></pre>
    </section>
    <aside id="inspector" class="inspector"><div class="ins-head"><div class="eyebrow">INSPECTOR</div><div class="small">Select an element to begin.</div></div></aside>
  </main>
  <footer class="statusbar"><span id="status"><strong>Ready</strong></span><span>Drag elements · Resize handles · Arrow keys nudge</span><span>Zoom <input id="zoom" type="range" min="30" max="100" value="60" aria-label="Zoom"></span></footer>
</div>
<script src="/command/designer.js?v=20260915"></script>
</body>
</html>
