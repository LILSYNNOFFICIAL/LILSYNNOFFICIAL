<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIL SYNN | Official Website</title>

    <meta name="description" content="LIL SYNN - AI Music Artist specializing in Dark Electropop, Melodic Trap, Ambient R&B, Emo Rap, Slow Tempo, Atmospheric music with deep male vocals">
    <meta name="keywords" content="LIL SYNN, AI music, dark electropop, melodic trap, ambient rnb, emo rap, atmospheric, dubstep, riddim">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Overrides: semi-transparent nav, fixed background video under nav, remove neon glow, remove hero title -->
    <style>
      :root { --nav-height: 72px; --nav-gap: 0.5rem; }

      nav { height: var(--nav-height); }
      nav > .max-w-7xl { height: 100%; display: flex; align-items: center; }

      #home {
        padding-top: calc(var(--nav-height) + var(--nav-gap));
        min-height: calc(100vh - var(--nav-height));
        position: relative;
        z-index: 10;
        overflow: hidden;
      }

      #bgVideo {
        position: fixed;
        top: var(--nav-height);
        left: 0;
        width: 100vw;
        height: calc(100vh - var(--nav-height));
        object-fit: cover;
        transform: none !important;
        z-index: 0;
        opacity: 0.95;
        pointer-events: none;
      }

      .video-gradient-overlay { z-index: 5; pointer-events: none; }

      .neon-text {
        text-shadow: none !important;
        filter: none !important;
        color: #ffffff !important;
      }

      section { position: relative; z-index: 10; }
      #sideMenu { z-index: 60; }

      nav .flex.items-center { gap: 0.75rem; }
      nav .flex.items-center span { line-height: 1; display:inline-block; }

      @media (max-width:640px) {
        nav .flex.items-center .text-4xl { font-size: 1.25rem; }
        nav .flex.items-center .text-5xl { font-size: 1.4rem; }
        nav .max-w-7xl { padding-left: 1rem; padding-right: 1rem; }
      }

      /* Keep the Socials list scrollable on desktop without changing mobile behavior. */
      @media (min-width: 768px) {
        #sideMenu #socialsDropdown {
          max-height: calc(100vh - 250px);
          overflow-y: auto;
          overscroll-behavior: contain;
          padding-right: 0.75rem;
          scrollbar-width: thin;
        }
      }

      #presave .max-w-4xl a { display:inline-block; margin-top: 0.5rem; }

      .youtube-iframe { width:100%; height:220px; border:0; display:block; }
      @media (max-width:640px) { .youtube-iframe { height:160px; } }
      @media (min-width:1024px) { .youtube-iframe { height:260px; } }

      /* Black backing is applied only to the SVG social buttons, not the surrounding footer. */
      #main-social-grid a.social-icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        margin: 0 auto;
        padding: 8px;
        background: #000000;
        border-radius: 12px;
      }

      #main-social-grid img.social-icon { max-width:64px; max-height:64px; }
    </style>

</head>

<body class="bg-black text-white overflow-x-hidden font-['Inter']">
