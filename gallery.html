<!doctype html>
<html lang="en">
<head>

<title>LIL SYNN | Visual Archive</title>

<link rel="canonical" href="https://lilsynn.com/gallery.html">
<style>
.gallery-page{--gp:#ff008f;--gv:#8d3dff;--gc:#48d9ff;position:relative;isolation:isolate;max-width:1320px;margin:0 auto;padding:0 22px 88px;color:#fff;overflow:hidden}
.gallery-page:before{content:"";position:absolute;width:min(70vw,900px);height:min(70vw,900px);left:50%;top:190px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,0,143,.18),rgba(141,61,255,.08) 28%,transparent 64%);filter:blur(8px);pointer-events:none;z-index:-2;animation:gpPulse 8s ease-in-out infinite}
.gallery-page:after{content:"";position:absolute;inset:120px 0 0;pointer-events:none;z-index:-3;opacity:.35;background:radial-gradient(circle at 50% 8%,rgba(72,217,255,.11) 0 1px,transparent 2px),radial-gradient(circle at 14% 31%,rgba(255,255,255,.11) 0 1px,transparent 2px),radial-gradient(circle at 82% 42%,rgba(255,0,143,.12) 0 1px,transparent 2px);background-size:170px 170px,230px 230px,260px 260px;mask-image:linear-gradient(#000,transparent 88%)}
@keyframes gpPulse{0%,100%{opacity:.65;transform:translateX(-50%) scale(.92)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.gallery-hero{position:relative;min-height:330px;display:grid;place-items:center;text-align:center;padding:42px 10px 34px}
.gallery-core{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 44% 40%,rgba(255,255,255,.92) 0 2%,rgba(255,0,143,.82) 8%,rgba(141,61,255,.38) 28%,transparent 63%);box-shadow:0 0 35px rgba(255,0,143,.25),0 0 100px rgba(141,61,255,.16),inset 0 0 45px rgba(255,255,255,.08);animation:gpBreath 6s ease-in-out infinite}
.gallery-core:before,.gallery-core:after{content:"";position:absolute;inset:-30px;border:1px solid rgba(255,0,143,.27);border-radius:50%;transform:rotateX(68deg) rotateZ(8deg)}
.gallery-core:after{inset:-58px;border-color:rgba(72,217,255,.17);transform:rotateX(70deg) rotateZ(-18deg);animation:gpOrbit 11s linear infinite}
@keyframes gpBreath{0%,100%{transform:scale(.94);opacity:.86}50%{transform:scale(1.05);opacity:1}}
@keyframes gpOrbit{to{transform:rotateX(70deg) rotateZ(342deg)}}
.gallery-hero-content{position:relative;z-index:2;max-width:900px}
.gallery-kicker{display:inline-block;margin-bottom:13px;color:#ff74c9;font:700 11px Rajdhani,sans-serif;letter-spacing:.28em}
.gallery-title{margin:0;font:700 clamp(38px,7vw,78px) Orbitron,sans-serif;letter-spacing:.1em;line-height:.98;text-shadow:0 0 28px rgba(255,0,143,.22)}
.gallery-subtitle{max-width:720px;margin:18px auto 0;color:#b5b5bd;font:500 clamp(14px,2vw,17px) Rajdhani,sans-serif;line-height:1.6;letter-spacing:.04em}
.gallery-rule{width:min(520px,80%);height:1px;margin:25px auto 0;background:linear-gradient(90deg,transparent,rgba(255,0,143,.75),rgba(72,217,255,.55),transparent);box-shadow:0 0 18px rgba(255,0,143,.2)}
.gallery-toolbar{position:sticky;top:var(--ls-header-height,112px);z-index:8;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:13px 0;margin:0 0 28px;background:linear-gradient(180deg,rgba(3,3,8,.96),rgba(3,3,8,.76),transparent);backdrop-filter:blur(12px)}
.gallery-filter{border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(7,7,14,.82);color:#bdbdc7;padding:9px 15px;font:700 10px Rajdhani,sans-serif;letter-spacing:.16em;cursor:pointer;transition:.2s}
.gallery-filter:hover,.gallery-filter:focus-visible,.gallery-filter.active{color:#fff;border-color:rgba(255,0,143,.75);background:linear-gradient(135deg,rgba(255,0,143,.18),rgba(141,61,255,.12));box-shadow:0 0 24px rgba(255,0,143,.12);outline:none}
.gallery-section-heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 14px}
.gallery-section-heading h2{margin:0;font:700 clamp(20px,3vw,30px) Orbitron,sans-serif;letter-spacing:.08em}
.gallery-section-heading p{margin:0;color:#74747f;font:600 11px Rajdhani,sans-serif;letter-spacing:.12em}
.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gallery-card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:0;background:rgba(5,5,11,.86);color:#fff;text-align:left;cursor:pointer;transition:transform .3s,border-color .3s,box-shadow .3s;content-visibility:auto;contain-intrinsic-size:320px}
.gallery-card:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.09) 47%,transparent 66%);transform:translateX(-130%);transition:transform .65s;pointer-events:none}
.gallery-card:hover,.gallery-card:focus-visible{transform:translateY(-5px) scale(1.008);border-color:rgba(255,0,143,.55);box-shadow:0 18px 45px rgba(0,0,0,.45),0 0 32px rgba(255,0,143,.09);outline:none}
.gallery-card:hover:after,.gallery-card:focus-visible:after{transform:translateX(130%)}
.gallery-art{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#09090d;transition:transform .5s,filter .5s}
.gallery-card:hover .gallery-art,.gallery-card:focus-visible .gallery-art{transform:scale(1.035);filter:saturate(1.08) contrast(1.03)}
.gallery-copy{display:block;padding:12px 13px 14px;background:linear-gradient(180deg,rgba(7,7,13,.82),rgba(3,3,8,.98))}
.gallery-type{display:block;color:#ff63bf;font:700 9px Rajdhani,sans-serif;letter-spacing:.17em}
.gallery-card h3{margin:5px 0 0;font:700 14px Orbitron,sans-serif;line-height:1.25}
.gallery-meta{display:block;margin-top:5px;color:#73737e;font:600 10px Rajdhani,sans-serif;letter-spacing:.07em}
.gallery-empty{grid-column:1/-1;padding:50px 20px;border:1px dashed rgba(255,255,255,.12);border-radius:16px;color:#888;text-align:center;font:600 13px Rajdhani,sans-serif}
.gallery-lightbox{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(0,0,0,.94);backdrop-filter:blur(16px)}
.gallery-lightbox.open{display:flex}
.gallery-lightbox:before{content:"";position:absolute;width:65vw;height:65vw;max-width:850px;max-height:850px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,143,.11),transparent 65%)}
.gallery-lightbox-image{position:relative;z-index:1;max-width:min(90vw,1200px);max-height:82vh;object-fit:contain;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 70px rgba(255,0,143,.12)}
.gallery-lightbox-copy{position:absolute;z-index:2;left:50%;bottom:22px;transform:translateX(-50%);width:min(760px,80vw);text-align:center;pointer-events:none}
.gallery-lightbox-copy strong{display:block;font:700 17px Orbitron,sans-serif;letter-spacing:.05em}.gallery-lightbox-copy span{display:block;margin-top:5px;color:#999;font:600 11px Rajdhani,sans-serif;letter-spacing:.12em}
.gallery-lightbox button{position:absolute;z-index:3;width:48px;height:48px;border:1px solid rgba(255,0,143,.38);border-radius:50%;background:rgba(5,5,10,.84);color:#fff;font:400 26px/1 Arial,sans-serif;cursor:pointer;transition:.2s}
.gallery-lightbox button:hover,.gallery-lightbox button:focus-visible{border-color:rgba(255,0,143,.85);background:rgba(255,0,143,.15);outline:none}
.gallery-close{top:18px;right:18px}.gallery-prev{left:18px;top:50%;transform:translateY(-50%)}.gallery-next{right:18px;top:50%;transform:translateY(-50%)}
@media(max-width:1050px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.gallery-page{padding-left:14px;padding-right:14px;padding-bottom:60px}.gallery-hero{min-height:285px;padding-top:30px}.gallery-core{width:190px;height:190px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery-card{border-radius:13px}.gallery-copy{padding:10px}.gallery-card h3{font-size:11px}.gallery-lightbox{padding:14px}.gallery-lightbox-image{max-width:96vw;max-height:74vh}.gallery-lightbox-copy{bottom:14px;width:86vw}.gallery-prev{left:8px}.gallery-next{right:8px}}
@media(max-width:420px){.gallery-grid{grid-template-columns:1fr}.gallery-card h3{font-size:13px}.gallery-section-heading{display:block}.gallery-section-heading p{margin-top:5px}}
@media(prefers-reduced-motion:reduce){.gallery-page:before,.gallery-core,.gallery-core:after{animation:none}.gallery-card,.gallery-art,.gallery-filter{transition:none}}
</style>
</head>
<body>
<main class="gallery-page">
<section class="gallery-hero" aria-labelledby="gallery-title">
<div class="gallery-core" aria-hidden="true"></div>
<div class="gallery-hero-content">
<span class="gallery-kicker">LIL SYNN · VISUAL ARCHIVE</span>
<h1 class="gallery-title" id="gallery-title">VISUALS</h1>
<p class="gallery-subtitle">A living archive of the faces, characters, worlds, release artwork, and visual identities that make up the LIL SYNN universe.</p>
<div class="gallery-rule" aria-hidden="true"></div>
</div>
</section>
<div class="gallery-toolbar" aria-label="Visual archive filters">
<button class="gallery-filter active" type="button" data-filter="all">ALL VISUALS</button>
<button class="gallery-filter" type="button" data-filter="characters">CHARACTERS</button>
<button class="gallery-filter" type="button" data-filter="new">3D / NEW ART</button>
<button class="gallery-filter" type="button" data-filter="world">WORLD / KEY ART</button>
</div>
<section aria-labelledby="archive-heading">
<div class="gallery-section-heading"><h2 id="archive-heading">THE ARCHIVE</h2><p id="gallery-count">Loading visual records…</p></div>
<div class="gallery-grid" id="gallery-grid" aria-live="polite"></div>
</section>
</main>
<div class="gallery-lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
<button class="gallery-close" id="gallery-close" type="button" aria-label="Close artwork viewer">×</button>
<button class="gallery-prev" id="gallery-prev" type="button" aria-label="Previous artwork">‹</button>
<img class="gallery-lightbox-image" id="gallery-lightbox-image" alt="">
<button class="gallery-next" id="gallery-next" type="button" aria-label="Next artwork">›</button>
<div class="gallery-lightbox-copy"><strong id="gallery-lightbox-title"></strong><span id="gallery-lightbox-meta"></span></div>
</div>

const grid=document.getElementById("gallery-grid"),count=document.getElementById("gallery-count"),box=document.getElementById("gallery-lightbox"),image=document.getElementById("gallery-lightbox-image"),lt=document.getElementById("gallery-lightbox-title"),lm=document.getElementById("gallery-lightbox-meta");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),label=x=>x==="characters"?"CHARACTER / VISUAL":x==="releases"?"RELEASE ART":x==="new"?"NEW ART":"WORLD / KEY ART";
let visible=[],current=0;
function render(filter="all"){visible=filter==="all"?assets:assets.filter(x=>x[0]===filter);count.textContent=visible.length+" VISUAL RECORDS";grid.innerHTML=visible.length?visible.map((x,i)=>'<button class="gallery-card" type="button" data-index="'+i+'" aria-label="Open '+esc(x[2])+'"><img class="gallery-art" src="'+x[4]+'" alt="'+esc(x[2])+'" loading="lazy" decoding="async"><span class="gallery-copy"><span class="gallery-type">'+label(x[0])+'</span><h3>'+esc(x[2])+'</h3><span class="gallery-meta">'+esc(x[3])+'</span></span></button>').join(""):'<div class="gallery-empty">No artwork is assigned to this archive view.</div>';grid.querySelectorAll(".gallery-card").forEach(c=>c.addEventListener("click",()=>open(+c.dataset.index)));}
function open(i){if(!visible.length)return;current=(i+visible.length)%visible.length;const x=visible[current];image.src=x[4];image.alt=x[2];lt.textContent=x[2];lm.textContent=x[3];box.classList.add("open");document.body.style.overflow="hidden";}
function close(){box.classList.remove("open");document.body.style.overflow="";}
function step(n){open(current+n)}
document.querySelectorAll(".gallery-filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".gallery-filter").forEach(x=>x.classList.toggle("active",x===b));render(b.dataset.filter);document.getElementById("archive-heading").scrollIntoView({behavior:"smooth",block:"start"});}));
document.getElementById("gallery-close").onclick=close;document.getElementById("gallery-prev").onclick=()=>step(-1);document.getElementById("gallery-next").onclick=()=>step(1);box.addEventListener("click",e=>{if(e.target===box)close()});
document.addEventListener("keydown",e=>{if(!box.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
let sx=0;box.addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});box.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)step(dx<0?1:-1)},{passive:true});render();
})();
