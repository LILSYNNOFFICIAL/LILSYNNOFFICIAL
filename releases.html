<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIL SYNN | Releases</title><meta name="description" content="Explore the complete LIL SYNN release archive — albums, EPs and singles, newest releases first, with direct Apple Music and Spotify links."><link rel="canonical" href="https://lilsynn.com/releases"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>:root{--pink:#ff008f;--pink2:#ff4fd8}*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,0,143,.3)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 24px Orbitron,sans-serif;letter-spacing:.12em;color:var(--pink)}.back{font:600 15px Rajdhani,sans-serif;letter-spacing:.08em;border:1px solid rgba(255,0,143,.45);padding:9px 14px;border-radius:10px}main{padding:70px 0}.kicker{text-align:center;color:var(--pink2);font:700 14px Rajdhani,sans-serif;letter-spacing:.22em;margin:0 0 12px}.title{text-align:center;font:700 clamp(38px,7vw,72px) Orbitron,sans-serif;letter-spacing:.08em;margin:0}.intro{text-align:center;color:#ccc;max-width:850px;margin:20px auto 30px;line-height:1.7}.sortbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 40px;padding:14px 16px;border:1px solid rgba(255,0,143,.25);border-radius:14px;background:rgba(255,0,143,.04)}.sortbar label{font:700 13px Rajdhani,sans-serif;letter-spacing:.12em}.sortbar select{background:#090909;color:#fff;border:1px solid rgba(255,0,143,.5);border-radius:9px;padding:9px 12px;font:600 14px Rajdhani,sans-serif}.release{background:linear-gradient(145deg,#111,#080808);border:1px solid rgba(255,0,143,.28);border-radius:18px;overflow:hidden;margin:0 0 24px}.release-grid{display:grid;grid-template-columns:190px 1fr}.art{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#111}.release-body{padding:24px}.type{display:inline-block;color:var(--pink2);font:700 11px Rajdhani,sans-serif;letter-spacing:.15em;text-transform:uppercase;margin:0 0 9px}.name{font:700 clamp(22px,3vw,32px) Orbitron,sans-serif;margin:0 0 14px;line-height:1.2}.tracks{margin:0 0 20px;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.08)}.track{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font:600 15px Rajdhani,sans-serif}.track-number{color:#777;min-width:24px}.track-title{flex:1}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font:700 11px Rajdhani,sans-serif;letter-spacing:.08em;color:var(--pink2);border:1px solid rgba(255,0,143,.35);padding:7px 9px;border-radius:7px}.singles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-bottom:24px}.single{background:linear-gradient(145deg,#111,#080808);border:1px solid rgba(255,0,143,.28);border-radius:16px;overflow:hidden}.single-body{padding:12px}.single-name{font:700 14px Orbitron,sans-serif;margin:0 0 10px;line-height:1.25}.single .links{gap:5px}.single .links a{font-size:10px;padding:6px 7px}.status{text-align:center;color:#999;padding:50px}@media(max-width:1000px){.singles{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:900px){.release-grid{grid-template-columns:160px 1fr}.singles{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.singles{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:0 16px}main{padding:50px 0}.brand{font-size:18px}.title{font-size:34px}.sortbar{justify-content:flex-start}.release-grid{grid-template-columns:1fr}.release .art{max-width:220px;margin:auto}.release-body{padding:18px}.singles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.track{align-items:flex-start;flex-wrap:wrap}.track .links{width:100%;margin-left:36px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="/">LIL SYNN</a><a class="back" href="/">← BACK TO SITE</a></div></header><main><div class="wrap"><p class="kicker">THE COMPLETE CATALOG</p><h1 class="title">RELEASES</h1><p class="intro">Albums, EPs and singles are arranged in your catalog order. Every song uses direct Apple Music and Spotify destinations when the platform has the release.</p><div class="sortbar"><label for="release-sort">SORT BY</label><select id="release-sort"><option value="newest">Newest → Oldest</option><option value="oldest">Oldest → Newest</option><option value="az">A → Z</option><option value="za">Z → A</option><option value="singles">Singles First</option><option value="collections">Albums / EPs First</option></select></div><div id="releases"><div class="status">Loading the complete release archive…</div></div></div></main><footer><div class="wrap">LIL SYNN · OFFICIAL WEBSITE · © 2026 LIL SYNN</div></footer><script>
const ART_DIR='https://raw.githubusercontent.com/LILSYNNOFFICIAL/LILSYNNOFFICIAL/main/assets/images/icons/album_art/';
const ART_API='https://api.github.com/repos/LILSYNNOFFICIAL/LILSYNNOFFICIAL/contents/assets/images/icons/album_art?ref=main';
const HINDSIGHT_ART='https://raw.githubusercontent.com/LILSYNNOFFICIAL/LILSYNNOFFICIAL/main/assets/images/icons/album_art/Hindsight.jpg';
const grid=document.getElementById('releases'),sorter=document.getElementById('release-sort');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');
const btn=(label,url)=>url?`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`:'';
const fileTitle=n=>n.replace(/^\d+_lil_synn_/i,'').replace(/\.jpg$/i,'').replace(/_/g,' ');
const findArt=(title,files)=>{if(norm(title)==='hindsight')return HINDSIGHT_ART;const k=norm(title);let f=files.find(x=>norm(fileTitle(x.name))===k);if(!f)f=files.find(x=>{const n=norm(fileTitle(x.name));return n.includes(k)||k.includes(n)});return f?ART_DIR+encodeURIComponent(f.name):''};
const appleKey=s=>norm(s).replace(/acousticversion$/,'acousticversion');
let APPLE_SONGS=new Map(),APPLE_ALBUMS=new Map();
async function loadApple(){const [songs,albums]=await Promise.all([fetch('https://itunes.apple.com/lookup?id=1850720041&entity=song&limit=200').then(r=>r.json()),fetch('https://itunes.apple.com/lookup?id=1850720041&entity=album&limit=100').then(r=>r.json())]);for(const x of songs.results||[]){if(x.wrapperType==='track'&&x.artistName==='LIL SYNN'&&x.trackName)APPLE_SONGS.set(appleKey(x.trackName),x)}for(const x of albums.results||[]){if(x.wrapperType==='collection'&&x.artistName==='LIL SYNN'&&x.collectionName)APPLE_ALBUMS.set(norm(x.collectionName),x)}}
function appleSong(title){let x=APPLE_SONGS.get(appleKey(title));if(!x){for(const [k,v] of APPLE_SONGS){if(k.includes(appleKey(title))||appleKey(title).includes(k)){x=v;break}}}return x?.trackViewUrl||''}
function appleAlbum(title){return APPLE_ALBUMS.get(norm(title))?.collectionViewUrl||''}
function makeSingle(title,order,art,catalog){return `<article class="single" data-title="${esc(title)}" data-type="SINGLE" data-order="${order}">${art?`<img class="art" src="${art}" alt="${esc(title)} — LIL SYNN artwork" loading="lazy" decoding="async">`:`<div class="art" aria-hidden="true"></div>`}<div class="single-body"><p class="type">SINGLE</p><h2 class="single-name">${esc(title)}</h2><div class="links">${btn('SPOTIFY',catalog.trackSpotify?.[title])}${btn('APPLE MUSIC',appleSong(title))}</div></div></article>`}
async function render(catalog,files){let out='',singleCards=[];const flush=()=>{if(singleCards.length){out+=`<div class="singles">${singleCards.join('')}</div>`;singleCards=[]}};for(let i=0;i<catalog.order.length;i++){const title=catalog.order[i];if(title==='Touching to the North'){flush();out+=`<article class="release" data-title="Touching to the North" data-type="COLLECTION" data-order="${i}"><div class="release-grid"><div><img class="art" src="https://i1.sndcdn.com/artworks-KCXRktlrcYPqru3g-ftlP8g-t500x500.png" alt="Touching to the North — LIL SYNN artwork"></div><div class="release-body"><p class="type">ALBUM</p><h2 class="name">TOUCHING TO THE NORTH</h2><p style="color:#aaa">SoundCloud-only album.</p><div class="links">${btn('SOUNDCLOUD','https://soundcloud.com/lilsynnofficial/sets/touching-to-the-north')}</div></div></div></article>`;continue}const group=catalog.groups?.[title];if(!group){singleCards.push(makeSingle(title,i,findArt(title,files),catalog));continue}flush();const rows=group.tracks.map((track,n)=>`<li class="track"><span class="track-number">${String(n+1).padStart(2,'0')}</span><span class="track-title">${esc(track)}</span><span class="links">${btn('SPOTIFY',catalog.trackSpotify?.[track])}${btn('APPLE MUSIC',appleSong(track))}</span></li>`).join('');const art=findArt(title,files)||findArt(group.tracks.at(-1),files);out+=`<article class="release" data-title="${esc(title)}" data-type="${group.type==='ALBUM'?'ALBUM':'EP'}" data-order="${i}"><div class="release-grid"><div><img class="art" src="${art}" alt="${esc(title)} — LIL SYNN artwork" loading="lazy" decoding="async"></div><div class="release-body"><p class="type">${esc(group.type)}</p><h2 class="name">${esc(title)}</h2><ol class="tracks">${rows}</ol><div class="links">${btn('SPOTIFY',catalog.spotify?.[title])}${btn('APPLE MUSIC',appleAlbum(title))}</div></div></div></article>`}flush();grid.innerHTML=out;applySort()}
function applySort(){const mode=sorter.value;const items=[...grid.querySelectorAll(':scope > .release, :scope > .singles > .single')];const singles=items.filter(x=>x.dataset.type==='SINGLE');const collections=items.filter(x=>x.dataset.type!=='SINGLE');let arr=[...items];if(mode==='newest')arr.sort((a,b)=>+a.dataset.order-+b.dataset.order);else if(mode==='oldest')arr.sort((a,b)=>+b.dataset.order-+a.dataset.order);else if(mode==='az')arr.sort((a,b)=>a.dataset.title.localeCompare(b.dataset.title));else if(mode==='za')arr.sort((a,b)=>b.dataset.title.localeCompare(a.dataset.title));else if(mode==='singles')arr=[...singles,...collections];else if(mode==='collections')arr=[...collections,...singles];grid.innerHTML='';let sg=null;for(const el of arr){if(el.dataset.type==='SINGLE'){if(!sg){sg=document.createElement('div');sg.className='singles';grid.appendChild(sg)}sg.appendChild(el)}else{sg=null;grid.appendChild(el)}}}
sorter.addEventListener('change',applySort);
(async()=>{try{const [catalog,artResponse]=await Promise.all([fetch('/release-catalog.json?archive_refresh='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch(ART_API+'&_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[])]);const files=artResponse.filter(x=>x.type==='file'&&(/\.jpg$/i.test(x.name)));await loadApple();await render(catalog,files)}catch(e){console.error('Release archive failed',e);grid.innerHTML='<div class="status">The release archive is temporarily unavailable. Please refresh the page.</div>'}})();
</script></body></html>
