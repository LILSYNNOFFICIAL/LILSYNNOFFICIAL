<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIL SYNN | Releases</title><meta name="description" content="LIL SYNN release catalog — albums, EPs and singles."><style>body{background:transparent;color:#fff}.release-page{width:min(1220px,92vw);margin:auto;padding:88px 0 90px}.release-head{text-align:center;margin-bottom:38px}.ey{font:700 10px Rajdhani;letter-spacing:.3em;color:#ff4fd8}.release-head h1{font:800 clamp(42px,7vw,82px)/.86 Orbitron;margin:12px 0}.release-head p{max-width:680px;margin:auto;color:#aaa;font:500 15px/1.55 Rajdhani}.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:26px 0 30px}.filters select{background:rgba(4,4,7,.9);color:#fff;border:1px solid rgba(255,0,143,.4);padding:10px 12px;font:700 10px Rajdhani;letter-spacing:.12em}.release-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.release-card{display:flex;flex-direction:column;min-width:0;background:rgba(6,6,9,.86);border:1px solid rgba(255,255,255,.1);overflow:hidden;transition:.2s}.release-card:hover{transform:translateY(-2px);border-color:rgba(255,0,143,.55)}.art-link{display:block;background:#09090c}.release-art{display:block;width:100%;aspect-ratio:1;object-fit:cover}.release-body{display:flex;flex:1;flex-direction:column;padding:17px}.release-type{font:800 9px Rajdhani;color:#ff4fd8;letter-spacing:.2em}.release-title{font:800 21px/1.05 Orbitron;margin:8px 0 8px}.release-meta{font:500 12px/1.45 Rajdhani;color:#999;margin-bottom:15px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.actions a{display:inline-flex;align-items:center;justify-content:center;padding:9px 10px;border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font:800 8px Rajdhani;letter-spacing:.13em}.actions .spotify{background:#1db954;border-color:#1db954;color:#050505}.actions .apple{background:#ff008f;border-color:#ff008f;color:#050005}.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:60px}.catalog-note{text-align:center;color:#666;font:700 9px Rajdhani;letter-spacing:.16em;margin:0 0 22px}@media(max-width:850px){.release-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.release-page{padding-top:78px}.release-grid{grid-template-columns:1fr}.release-title{font-size:19px}}</style><script src="/site-shell.js?v=20260918-routefix"></script></head><body><main class="release-page"><header class="release-head"><div class="ey">LIL SYNN / OFFICIAL CATALOG</div><h1>RELEASES</h1><p>The visual release catalog. Open any release for its full track experience, artwork, listening links, and related material.</p></header><div class="filters"><select id="type"><option value="all">ALL RELEASES</option><option value="album">ALBUMS</option><option value="ep">EPs</option><option value="single">SINGLES</option></select><select id="sort"><option value="catalog">NEWEST FIRST</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div><div class="catalog-note">ARCHIVE EXPLORER IS FOR SEARCH + FILTERING · THIS PAGE IS THE RELEASE CATALOG</div><section id="releases" class="release-grid"><div class="empty">LOADING RELEASES…</div></section></main><script>const base='/assets/images/icons/album_art/';const norm=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const art=t=>data?.artwork?.[norm(t)]?base+encodeURIComponent(data.artwork[norm(t)]):'';let data=null;const type=t=>data?.groups?.[t]?.type?.toLowerCase()||'single';const spotify=t=>data?.groups?.[t]?.spotify||data?.spotify?.[t]||data?.trackSpotify?.[t]||'';const apple=t=>data?.groups?.[t]?.apple||data?.apple?.[t]||'';function render(){let o=[...(data.order||[])];const f=document.getElementById('type').value,s=document.getElementById('sort').value;if(f!=='all')o=o.filter(t=>type(t)===f);if(s==='az')o.sort((a,b)=>a.localeCompare(b));if(s==='za')o.sort((a,b)=>b.localeCompare(a));const root=document.getElementById('releases');if(!o.length){root.innerHTML='<div class="empty">NO RELEASES MATCH THIS FILTER.</div>';return}root.innerHTML=o.map((t,i)=>{const g=data.groups?.[t],tracks=g?.tracks?.length?g.tracks:[],a=art(t),sp=spotify(t),ap=apple(t);return `<article class="release-card"><a class="art-link" href="/release.html?id=${encodeURIComponent(t)}">${a?`<img class="release-art" src="${a}" alt="${esc(t)} artwork" loading="lazy" decoding="async">`:''}</a><div class="release-body"><div class="release-type">${esc(g?.type||'SINGLE')} · ${String(i+1).padStart(2,'0')}</div><div class="release-title">${esc(t)}</div><div class="release-meta">${tracks.length?`${tracks.length} track${tracks.length===1?'':'s'}`:'Single release'} · Canonical catalog entry</div><div class="actions">${sp?`<a class="spotify" href="${esc(sp)}" target="_blank" rel="noopener noreferrer">SPOTIFY</a>`:''}${ap?`<a class="apple" href="${esc(ap)}" target="_blank" rel="noopener noreferrer">APPLE MUSIC</a>`:''}<a href="/release.html?id=${encodeURIComponent(t)}">OPEN RELEASE ↗</a></div></div></article>`}).join('')}document.getElementById('type').onchange=render;document.getElementById('sort').onchange=render;fetch('/release-catalog.json',{cache:'no-store'}).then(r=>r.json()).then(c=>{data=c;render()}).catch(()=>document.getElementById('releases').innerHTML='<div class="empty">RELEASE CATALOG UNAVAILABLE.</div>');</script></body></html>
