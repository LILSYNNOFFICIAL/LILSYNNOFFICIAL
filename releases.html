    :root{--pink:#ff008f;--pink2:#ff4fd8;--bg:#050505;--panel:#0d0d0d;--muted:#aaa}

    .art{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#111}.body{padding:18px}.type{display:inline-block;color:var(--pink2);font:700 11px Rajdhani,sans-serif;letter-spacing:.15em;text-transform:uppercase;margin:0 0 9px}.name{font:700 18px Orbitron,sans-serif;margin:0 0 7px;line-height:1.25}.meta{color:var(--muted);font:600 15px Rajdhani,sans-serif;margin:0 0 14px}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font:600 12px Rajdhani,sans-serif;letter-spacing:.08em;border:1px solid rgba(255,0,143,.4);padding:7px 9px;border-radius:8px}.links a:hover{background:var(--pink);color:#000;border-color:var(--pink)}
    .status{grid-column:1/-1;text-align:center;color:#999;padding:40px}.source-note{font:600 12px Rajdhani,sans-serif;color:#777;margin-top:10px}.source-note strong{color:#aaa}.soundcloud .type{color:#ff4fd8}.soundcloud .links a:first-child{border-color:rgba(255,79,216,.7)}
    footer{text-align:center;border-top:1px solid rgba(255,0,143,.2);padding:35px 20px;color:#777;font:600 14px Rajdhani,sans-serif;letter-spacing:.08em}footer a{color:#aaa}footer a:hover{color:var(--pink2)}
    @media(max-width:900px){#releases{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:0 16px}.nav{height:64px}.brand{font-size:18px}.back{font-size:13px}.title{font-size:34px}main{padding:55px 0}.intro{margin-bottom:38px}#releases{grid-template-columns:1fr;gap:18px}.body{padding:16px}}

<body>
<header><div class="wrap nav"><a class="brand" href="/">LIL SYNN</a><a class="back" href="/">← BACK TO SITE</a></div></header>
<main><div class="wrap"><p class="kicker">THE COMPLETE CATALOG</p><h1 class="title">RELEASES</h1><p class="intro">Albums, EPs, and singles from LIL SYNN — ordered newest first. This archive also includes <strong>Touching to the North</strong>, the SoundCloud-only album.</p><div id="releases"><div class="status">Loading releases…</div></div></div></main>
<footer><a href="/">LIL SYNN</a> · OFFICIAL WEBSITE · © 2026 LIL SYNN</footer>
<script>
const grid=document.getElementById('releases');
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fallbackArt=(title)=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><rect width="800" height="800" fill="#090909"/><rect x="24" y="24" width="752" height="752" rx="18" fill="none" stroke="#ff008f" stroke-width="3"/><text x="400" y="350" fill="#ff008f" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">LIL SYNN</text><text x="400" y="410" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" text-anchor="middle">${esc(title).replace(/&/g,'and')}</text></svg>`);
const manual=[
  {title:'Black Glass',type:'Single',date:'2026-08-12',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Black%20Glass%20LIL%20SYNN'},
  {title:'Hello Goodbye',type:'Album',date:'2026-07-31',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Hello%20Goodbye%20LIL%20SYNN'},
  {title:'Static On My Tongue',type:'Single',date:'2026-07-27',year:'2026',source:'Apple Music',url:'https://music.apple.com/us/artist/lil-synn/1850720041'},
  {title:"It's In Her Eyes",type:'Single',date:'2026-07-20',year:'2026',source:'Apple Music',url:'https://music.apple.com/us/artist/lil-synn/1850720041'},
  {title:'Fade Into You',type:'Single',date:'2026-06-07',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Fade%20Into%20You%20LIL%20SYNN'},
  {title:'Heal',type:'EP',date:'2026-05-01',year:'2026',source:'Apple Music',url:'https://music.apple.com/us/artist/lil-synn/1850720041'},
  {title:'Hindsight',type:'Single',date:'2026-04-20',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Hindsight%20LIL%20SYNN'},
  {title:'When The World Gets Loud',type:'Single',date:'2026-04-13',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/When%20The%20World%20Gets%20Loud%20LIL%20SYNN'},
  {title:'Manic Side',type:'Single',date:'2026-04-09',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Manic%20Side%20LIL%20SYNN'},
  {title:"Don't Say It (Acoustic)",type:'Single',date:'2026-04-08',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Don%27t%20Say%20It%20Acoustic%20LIL%20SYNN'},
  {title:"Don't Say It",type:'Single',date:'2026-04-07',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Don%27t%20Say%20It%20LIL%20SYNN'},
  {title:"Don't Let Me Go",type:'Single',date:'2026-04-04',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Don%27t%20Let%20Me%20Go%20LIL%20SYNN'},
  {title:'Signal Light Sermon (Remastered 2026)',type:'Single',date:'2026-04-02',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Signal%20Light%20Sermon%20Remastered%202026%20LIL%20SYNN'},
  {title:'Light',type:'Single',date:'2026-04-09',year:'2026',source:'Apple Music',url:'https://music.apple.com/us/artist/lil-synn/1850720041'},
  {title:'Enough',type:'Album',date:'2026-02-17',year:'2026',source:'Amazon Music',url:'https://music.amazon.com/search/Enough%20LIL%20SYNN'},
  {title:'My Light',type:'Single',date:'2026-01-01',year:'2026',source:'Shazam',url:'https://www.shazam.com/artist/lil-synn/1850720041'},
  {title:'Ties Remain',type:'Single',date:'2026-01-01',year:'2026',source:'Shazam',url:'https://www.shazam.com/artist/lil-synn/1850720041'},
  {title:'Gravity and Ghosts',type:'Single',date:'2025-01-01',year:'2025',source:'Shazam',url:'https://www.shazam.com/artist/lil-synn/1850720041'},
  {title:'Already Famous',type:'Single',date:'2025-01-01',year:'2025',source:'Shazam',url:'https://www.shazam.com/artist/lil-synn/1850720041'},
  {title:'Touching to the North',type:'Album',date:'2024-01-01',year:'SoundCloud',source:'SoundCloud',url:'https://soundcloud.com/lilsynnofficial/sets/touching-to-the-north',art:'https://i1.sndcdn.com/artworks-KCXRktlrcYPqru3g-ftlP8g-t500x500.png'}
];
function spotify(title){return 'https://open.spotify.com/search/'+encodeURIComponent('LIL SYNN '+title)}
function card(x){
  const title=esc(x.title), art=x.art||fallbackArt(x.title), date=x.date&&x.date!=='2026-01-01'&&x.date!=='2025-01-01'?new Date(x.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):x.year;
  const type=esc(x.type);
  return `<article class="card ${x.source==='SoundCloud'?'soundcloud':''}"><a href="${x.url}" target="_blank" rel="noopener noreferrer" aria-label="Open ${title} — ${type}"><img class="art" src="${art}" alt="${title} — LIL SYNN artwork" loading="lazy" decoding="async"></a><div class="body"><p class="type">${type}</p><h2 class="name">${title}</h2><p class="meta">${date}</p><div class="links"><a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.source==='SoundCloud'?'SOUNDCLOUD':'OPEN'}</a><a href="${spotify(x.title)}" target="_blank" rel="noopener noreferrer">SPOTIFY</a></div></div></article>`;
}
async function load(){
  try{
    let apple=[];
    try{
      const r=await fetch('https://itunes.apple.com/lookup?id=1850720041&entity=album&limit=200&sort=recent');
      if(r.ok){const d=await r.json();apple=(d.results||[]).filter(x=>x.wrapperType==='collection'&&x.collectionName&&x.artistName==='LIL SYNN').map(x=>({title:x.collectionName,type:(x.collectionType==='Album'?'Album':x.collectionType==='EP'?'EP':'Single'),date:x.releaseDate?x.releaseDate.slice(0,10):'2026-01-01',year:x.releaseDate?x.releaseDate.slice(0,4):'',source:'Apple Music',url:x.collectionViewUrl||'https://music.apple.com/us/artist/lil-synn/1850720041',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb')}));}
    }catch(_){ }
    const merged=[...manual,...apple];
    const seen=new Set();
    const releases=merged.filter(x=>{const key=x.title.toLowerCase().replace(/ - (single|ep)$/,'').trim();if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    grid.innerHTML=releases.map(card).join('')+'<div class="status source-note"><strong>Archive note:</strong> Streaming services can update independently. SoundCloud-only releases are included manually so the official archive remains complete.</div>';
  }catch(e){grid.innerHTML='<div class="status">The release archive is temporarily unavailable.</div>'}
}
load();
</script>
