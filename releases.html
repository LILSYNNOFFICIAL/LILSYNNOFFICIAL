<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIL SYNN | Releases</title>
<meta name="description" content="Explore the complete LIL SYNN release archive — albums, EPs and singles, newest releases first, with direct Apple Music and Spotify links.">
<link rel="canonical" href="https://lilsynn.com/releases">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff008f;--pink2:#ff4fd8}*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,0,143,.3)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 24px Orbitron,sans-serif;letter-spacing:.12em;color:var(--pink)}.back{font:600 15px Rajdhani,sans-serif;letter-spacing:.08em;border:1px solid rgba(255,0,143,.45);padding:9px 14px;border-radius:10px}main{padding:70px 0}.kicker{text-align:center;color:var(--pink2);font:700 14px Rajdhani,sans-serif;letter-spacing:.22em;margin:0 0 12px}.title{text-align:center;font:700 clamp(38px,7vw,72px) Orbitron,sans-serif;letter-spacing:.08em;margin:0}.intro{text-align:center;color:#ccc;max-width:850px;margin:20px auto 30px;line-height:1.7}.sortbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 40px;padding:14px 16px;border:1px solid rgba(255,0,143,.25);border-radius:14px;background:rgba(255,0,143,.04)}.sortbar label{font:700 13px Rajdhani,sans-serif;letter-spacing:.12em}.sortbar select{background:#090909;color:#fff;border:1px solid rgba(255,0,143,.5);border-radius:9px;padding:9px 12px;font:600 14px Rajdhani,sans-serif}.release{background:linear-gradient(145deg,#111,#080808);border:1px solid rgba(255,0,143,.28);border-radius:18px;overflow:hidden;margin:0 0 24px}.release-grid{display:grid;grid-template-columns:190px 1fr}.art{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#111}.release-body{padding:24px}.type{display:inline-block;color:var(--pink2);font:700 11px Rajdhani,sans-serif;letter-spacing:.15em;text-transform:uppercase;margin:0 0 9px}.name{font:700 clamp(22px,3vw,32px) Orbitron,sans-serif;margin:0 0 14px;line-height:1.2}.tracks{margin:0 0 20px;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.08)}.track{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font:600 15px Rajdhani,sans-serif}.track-number{color:#777;min-width:24px}.track-title{flex:1}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font:700 11px Rajdhani,sans-serif;letter-spacing:.08em;color:var(--pink2);border:1px solid rgba(255,0,143,.35);padding:7px 9px;border-radius:7px}.singles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-bottom:24px}.single{background:linear-gradient(145deg,#111,#080808);border:1px solid rgba(255,0,143,.28);border-radius:16px;overflow:hidden}.single-body{padding:12px}.single-name{font:700 14px Orbitron,sans-serif;margin:0 0 10px;line-height:1.25}.single .links{gap:5px}.single .links a{font-size:10px;padding:6px 7px}.status{text-align:center;color:#999;padding:50px}@media(max-width:1000px){.singles{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:900px){.release-grid{grid-template-columns:160px 1fr}.singles{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.singles{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:0 16px}main{padding:50px 0}.brand{font-size:18px}.title{font-size:34px}.sortbar{justify-content:flex-start}.release-grid{grid-template-columns:1fr}.release .art{max-width:220px;margin:auto}.release-body{padding:18px}.singles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.track{align-items:flex-start;flex-wrap:wrap}.track .links{width:100%;margin-left:36px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="/">LIL SYNN</a><a class="back" href="/">← BACK TO SITE</a></div></header>
<main><div class="wrap"><p class="kicker">THE COMPLETE CATALOG</p><h1 class="title">RELEASES</h1><p class="intro">Albums, EPs and singles are arranged in your catalog order. Every available song uses direct Apple Music and Spotify destinations.</p><div class="sortbar"><label for="release-sort">SORT BY</label><select id="release-sort"><option value="newest">Newest → Oldest</option><option value="oldest">Oldest → Newest</option><option value="az">A → Z</option><option value="za">Z → A</option><option value="singles">Singles First</option><option value="collections">Albums / EPs First</option></select></div><div id="releases"><div class="status">Loading the complete release archive…</div></div></div></main>
<footer><div class="wrap">LIL SYNN · OFFICIAL WEBSITE · © 2026 LIL SYNN</div></footer>
<script>
const ART_DIR='https://raw.githubusercontent.com/LILSYNNOFFICIAL/LILSYNNOFFICIAL/main/assets/images/icons/album_art/';
const ART_API='https://api.github.com/repos/LILSYNNOFFICIAL/LILSYNNOFFICIAL/contents/assets/images/icons/album_art?ref=main';
const HINDSIGHT_ART=ART_DIR+'Hindsight.jpg';
const RESCUE_YOU_ACOUSTIC_ART=ART_DIR+'RESCUE_YOU_A.png';
const grid=document.getElementById('releases'),sorter=document.getElementById('release-sort');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');
const btn=(label,url)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`:'';
const fileTitle=n=>n.replace(/^\d+_lil_synn_/i,'').replace(/\.(jpg|png)$/i,'').replace(/_/g,' ');
const findArt=(title,files)=>{if(norm(title)==='hindsight')return HINDSIGHT_ART;if(norm(title)==='rescueyouacousticversion')return RESCUE_YOU_ACOUSTIC_ART;const k=norm(title);let f=files.find(x=>norm(fileTitle(x.name))===k);if(!f)f=files.find(x=>{const n=norm(fileTitle(x.name));return n.includes(k)||k.includes(n)});return f?ART_DIR+encodeURIComponent(f.name):''};
const soundcloudTracks=[['Astral Signal','https://soundcloud.com/lilsynnofficial/01-astral-signal-1?in=lilsynnofficial/sets/touching-to-the-north&si=516878e74a8d437f8ebbb8b0e0231474&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['I Saw The Sky Breathe','https://soundcloud.com/lilsynnofficial/02-i-saw-the-sky-breathe-2?in=lilsynnofficial/sets/touching-to-the-north&si=ca94d159811848f29e1d968060a77a35&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Touching To The North','https://soundcloud.com/lilsynnofficial/03-touching-to-the-north-3?in=lilsynnofficial/sets/touching-to-the-north&si=c22b17f90bab4c8292a4e02f97386896&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Shadowboxing The Ego','https://soundcloud.com/lilsynnofficial/04-shadowboxing-the-ego-4?in=lilsynnofficial/sets/touching-to-the-north&si=55f050f4b8ac4b24a35279fe9990d86d&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Look Up, Look Within','https://soundcloud.com/lilsynnofficial/05-look-up-look-within-5?in=lilsynnofficial/sets/touching-to-the-north&si=3bf555fe01274277a56bff13aaee6f55&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Signal Light Sermon','https://soundcloud.com/lilsynnofficial/06-signal-light-sermon-6?in=lilsynnofficial/sets/touching-to-the-north&si=ce41d779d434414393f4b0d44f84cbbe&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Split Screen Mind','https://soundcloud.com/lilsynnofficial/07-split-screen-mind-7?in=lilsynnofficial/sets/touching-to-the-north&si=f3800344f10e4e1890819b1080dc194b&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['This Battle Is Mine','https://soundcloud.com/lilsynnofficial/08-this-battle-is-mine-8?in=lilsynnofficial/sets/touching-to-the-north&si=d87108451d154b6c9b604a5d2e16ff76&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],["Tomorrow Ain't Promised",'https://soundcloud.com/lilsynnofficial/09-tomorrow-aint-promised-9?in=lilsynnofficial/sets/touching-to-the-north&si=0ab7010fbed7484990cd08bdb997de18&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Celestial Flow','https://soundcloud.com/lilsynnofficial/10-celestial-flow-10?in=lilsynnofficial/sets/touching-to-the-north&si=7ae470e2fc054597865a584c7b227a1b&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Cipher Echo','https://soundcloud.com/lilsynnofficial/11-cipher-echo-11?in=lilsynnofficial/sets/touching-to-the-north&si=d7a85d1c8485456392f3ef94b69f162b&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Fragments Of Light','https://soundcloud.com/lilsynnofficial/12-fragments-of-light-12?in=lilsynnofficial/sets/touching-to-the-north&si=4696a5cc10f341a69e5a509e7653df8a&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing'],['Touching To The North (Radio Edit)','https://soundcloud.com/lilsynnofficial/lil-syn-touching-to-the-north?in=lilsynnofficial/sets/touching-to-the-north&si=a9638c7f3b6f4e5d8ccb1c0d33a0bac7&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing']];
let APPLE_SONGS=new Map();
async function loadAppleSongs(){const r=await fetch('https://itunes.apple.com/lookup?id=1850720041&entity=song&limit=200');const d=await r.json();for(const x of d.results||[])if(x.wrapperType==='track'&&x.artistName==='LIL SYNN'&&x.trackName&&x.trackViewUrl)APPLE_SONGS.set(norm(x.trackName),x.trackViewUrl)}
function appleSong(title){if(norm(title)==='rescueyouacousticversion')return 'https://music.apple.com/us/song/rescue-you-acoustic-version/6807294984';const k=norm(title);if(APPLE_SONGS.has(k))return APPLE_SONGS.get(k);for(const [key,url] of APPLE_SONGS)if(key.includes(k)||k.includes(key))return url;return ''}
function trackLinks(title,catalog){return btn('SPOTIFY',catalog.trackSpotify?.[title])+btn('APPLE MUSIC',appleSong(title))}
function makeSingle(title,order,art,catalog){return `<article class="single" data-title="${esc(title)}" data-type="SINGLE" data-order="${order}">${art?`<img class="art" src="${art}" alt="${esc(title)} — LIL SYNN artwork" loading="lazy" decoding="async">`:`<div class="art" aria-hidden="true"></div>`}<div class="single-body"><p class="type">SINGLE</p><h2 class="single-name">${esc(title)}</h2><div class="links">${trackLinks(title,catalog)}</div></div></article>`}
function makeTouching(order){const rows=soundcloudTracks.map((t,i)=>`<li class="track"><span class="track-number">${String(i+1).padStart(2,'0')}</span><span class="track-title">${esc(t[0])}</span><span class="links">${btn('SOUNDCLOUD',t[1])}</span></li>`).join('');return `<article class="release" data-title="Touching to the North" data-type="ALBUM" data-order="${order}"><div class="release-grid"><div><div class="art" style="background:url('https://i1.sndcdn.com/artworks-KCXRktlrcYPqru3g-ftlP8g-t500x500.png') center/cover no-repeat"></div></div><div class="release-body"><p class="type">ALBUM</p><h2 class="name">TOUCHING TO THE NORTH</h2><ol class="tracks">${rows}</ol><div class="links">${btn('SOUNDCLOUD','https://soundcloud.com/lilsynnofficial/sets/touching-to-the-north')}</div></div></div></article>`}
async function render(catalog,files){let blocks=[];for(let i=0;i<(catalog.order||[]).length;i++){const title=catalog.order[i];if(title==='Touching to the North'){blocks.push(makeTouching(i));continue}const group=catalog.groups?.[title];if(group?.tracks){const art=findArt(title,files)||findArt(group.tracks.at(-1),files);const rows=group.tracks.map((track,n)=>`<li class="track"><span class="track-number">${String(n+1).padStart(2,'0')}</span><span class="track-title">${esc(track)}</span><span class="links">${trackLinks(track,catalog)}</span></li>`).join('');const spotify=(title==='Don\'t Say It')?'':(catalog.spotify?.[title]||'');const apple=(title==='Heal'?'https://music.apple.com/us/album/heal-ep/6772323279':title==='Black Glass'?'https://music.apple.com/us/album/black-glass-single/6798970755':'');blocks.push(`<article class="release" data-title="${esc(title)}" data-type="${group.type==='ALBUM'?'ALBUM':'EP'}" data-order="${i}"><div class="release-grid"><div><img class="art" src="${art}" alt="${esc(title)} — LIL SYNN artwork" loading="lazy" decoding="async"></div><div class="release-body"><p class="type">${esc(group.type)}</p><h2 class="name">${esc(title)}</h2><ol class="tracks">${rows}</ol><div class="links">${btn('SPOTIFY',spotify)}${btn('APPLE MUSIC',apple)}</div></div></div></article>`)}else blocks.push(makeSingle(title,i,findArt(title,files),catalog))}grid.innerHTML=blocks.join('');applySort()}
function applySort(){const mode=sorter.value;const items=[...grid.querySelectorAll('.release,.single')];let arr=[...items];if(mode==='newest')arr.sort((a,b)=>+a.dataset.order-+b.dataset.order);else if(mode==='oldest')arr.sort((a,b)=>+b.dataset.order-+a.dataset.order);else if(mode==='az')arr.sort((a,b)=>a.dataset.title.localeCompare(b.dataset.title));else if(mode==='za')arr.sort((a,b)=>b.dataset.title.localeCompare(a.dataset.title));else if(mode==='singles')arr.sort((a,b)=>a.dataset.type==='SINGLE'&&b.dataset.type!=='SINGLE'?-1:a.dataset.type!=='SINGLE'&&b.dataset.type==='SINGLE'?1:+a.dataset.order-+b.dataset.order);else if(mode==='collections')arr.sort((a,b)=>a.dataset.type!=='SINGLE'&&b.dataset.type==='SINGLE'?-1:a.dataset.type==='SINGLE'&&b.dataset.type!=='SINGLE'?1:+a.dataset.order-+b.dataset.order);grid.innerHTML='';let singles=null;for(const el of arr){if(el.dataset.type==='SINGLE'){if(!singles){singles=document.createElement('div');singles.className='singles';grid.appendChild(singles)}singles.appendChild(el)}else{singles=null;grid.appendChild(el)}}}
sorter.addEventListener('change',applySort);
(async()=>{try{const [catalog,artResponse]=await Promise.all([fetch('/release-catalog.json?release_refresh='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('catalog');return r.json()}),fetch(ART_API+'&_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[])]);await loadAppleSongs();const files=artResponse.filter(x=>x.type==='file'&&/\.(jpg|png)$/i.test(x.name));await render(catalog,files)}catch(e){console.error('Release archive failed',e);grid.innerHTML='<div class="status">The release archive is temporarily unavailable. Please refresh the page.</div>'}})();
</script></body></html>
