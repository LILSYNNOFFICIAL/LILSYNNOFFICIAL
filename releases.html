:root{--pink:#ff008f;--pink2:#ff4fd8;--bg:#050505;--muted:#aaa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,0,143,.3)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 24px Orbitron,sans-serif;letter-spacing:.12em;color:var(--pink)}.back{font:600 15px Rajdhani,sans-serif;letter-spacing:.08em;border:1px solid rgba(255,0,143,.45);padding:9px 14px;border-radius:10px}.back:hover{border-color:var(--pink);color:var(--pink2)}main{padding:80px 0}.kicker{text-align:center;color:var(--pink2);font:700 14px Rajdhani,sans-serif;letter-spacing:.22em;margin:0 0 12px}.title{text-align:center;font:700 clamp(38px,7vw,72px) Orbitron,sans-serif;letter-spacing:.08em;margin:0}.intro{text-align:center;color:#ccc;max-width:820px;margin:20px auto 55px;line-height:1.7}#releases{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.card{background:linear-gradient(145deg,#111,#080808);border:1px solid rgba(255,0,143,.28);border-radius:22px;overflow:hidden;transition:.2s transform,.2s border-color}.card:hover{transform:translateY(-4px);border-color:var(--pink2)}.art{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#111}.body{padding:18px}.type{display:inline-block;color:var(--pink2);font:700 11px Rajdhani,sans-serif;letter-spacing:.15em;text-transform:uppercase;margin:0 0 9px}.name{font:700 18px Orbitron,sans-serif;margin:0 0 7px;line-height:1.25}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{font:700 12px Rajdhani,sans-serif;letter-spacing:.08em;border:1px solid rgba(255,0,143,.4);padding:7px 9px;border-radius:8px}.links a:hover{background:var(--pink);color:#000;border-color:var(--pink)}.status{grid-column:1/-1;text-align:center;color:#999;padding:50px}.note{grid-column:1/-1;text-align:center;color:#777;font:600 12px Rajdhani,sans-serif;letter-spacing:.04em;margin-top:4px}.note a{color:#aaa}.note a:hover{color:var(--pink2)}footer{text-align:center;border-top:1px solid rgba(255,0,143,.2);padding:35px 20px;color:#777;font:600 14px Rajdhani,sans-serif;letter-spacing:.08em}footer a{color:#aaa}footer a:hover{color:var(--pink2)}@media(max-width:900px){#releases{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:0 16px}.nav{height:64px}.brand{font-size:18px}.back{font-size:13px}.title{font-size:34px}main{padding:55px 0}.intro{margin-bottom:38px}#releases{grid-template-columns:1fr;gap:18px}.body{padding:16px}}

<body>
<header><div class="wrap nav"><a class="brand" href="/">LIL SYNN</a><a class="back" href="/">← BACK TO SITE</a></div></header>
<main><div class="wrap"><p class="kicker">THE COMPLETE CATALOG</p><h1 class="title">RELEASES</h1><p class="intro">Albums, EPs and singles from LIL SYNN — newest first. <strong>Enough</strong> and <strong>Hello Goodbye</strong> are albums. <strong>Heal</strong> is an EP. <strong>Touching to the North</strong> is a SoundCloud-only album.</p><div id="releases"><div class="status">Loading the complete release archive…</div></div></div></main>
<footer><a href="/">LIL SYNN</a> · OFFICIAL WEBSITE · © 2026 LIL SYNN</footer>
<script>
const grid=document.getElementById('releases');
const ART_DIR='https://raw.githubusercontent.com/LILSYNNOFFICIAL/LILSYNNOFFICIAL/main/assets/images/icons/album_art/';
const API='https://api.github.com/repos/LILSYNNOFFICIAL/LILSYNNOFFICIAL/contents/assets/images/icons/album_art?ref=main';
const special={
 'enough':'Album','hello_goodbye':'Album','heal':'EP'
};
const specialLinks={
 'touching to the north':{type:'Album',art:'https://i1.sndcdn.com/artworks-KCXRktlrcYPqru3g-ftlP8g-t500x500.png',url:'https://soundcloud.com/lilsynnofficial/sets/touching-to-the-north'}
};
const titleOverrides={
 "don_t_say_it___acoustic":"Don't Say It (Acoustic)",
 "signal_light_sermon___remastered_2026":"Signal Light Sermon (Remastered 2026)",
 "it_s_in_her_eyes":"It's In Her Eyes",
 "it_s_you":"It's You",
 "don_t_say_it":"Don't Say It",
 "don_t_say_it_right":"Don't Say It Right",
 "don_t_let_me_go":"Don't Let Me Go",
 "if_u_stay_ded":"IF U STAY DED",
 "black_glass___acoustic_version":"Black Glass (Acoustic Version)",
 "back_from_the_blackout":"Back From The Blackout",
 "when_the_world_gets_loud":"When The World Gets Loud",
 "static_on_my_tongue":"Static On My Tongue",
 "fade_into_you":"Fade Into You",
 "give_me_just_a_minute":"Give Me Just A Minute",
 "seat_still_warm":"Seat Still Warm",
 "every_heartbeat":"Every Heartbeat",
 "sin_with_me":"Sin With Me",
 "after_the_light":"After The Light",
 "touch_hunger":"Touch Hunger",
 "until_dawn":"Until Dawn",
 "every_time":"Every Time",
 "rescue_you":"Rescue You",
 "burn_it_down":"Burn It Down",
 "manic_side":"Manic Side",
 "lost_in_the_fog":"Lost In The Fog",
 "in_the_end":"In The End",
 "ties_remain":"Ties Remain",
 "gravity_and_ghosts":"Gravity and Ghosts",
 "word_to_word":"Word to Word",
 "through_the_flames":"Through the Flames",
 "already_famous":"Already Famous"
};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function titleFromFile(name){let key=name.replace(/^\d+_lil_synn_/i,'').replace(/\.jpg$/i,'');if(titleOverrides[key])return titleOverrides[key];return key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function keyFromTitle(title){return title.toLowerCase().replace(/\([^)]*\)/g,'').trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
function fallbackArt(title){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><rect width="800" height="800" fill="#090909"/><rect x="24" y="24" width="752" height="752" rx="18" fill="none" stroke="#ff008f" stroke-width="3"/><text x="400" y="350" fill="#ff008f" font-family="Arial" font-size="34" font-weight="700" text-anchor="middle">LIL SYNN</text><text x="400" y="410" fill="#fff" font-family="Arial" font-size="30" text-anchor="middle">${esc(title).replace(/&/g,'and')}</text></svg>`);}
function spotifySearch(title){return 'https://open.spotify.com/search/'+encodeURIComponent('LIL SYNN '+title);}
function card(x){const title=esc(x.title);const primary=x.url||spotifySearch(x.title);const button=x.source==='SoundCloud'?`<a href="${x.url}" target="_blank" rel="noopener noreferrer">SOUNDCLOUD</a>`:`<a href="${spotifySearch(x.title)}" target="_blank" rel="noopener noreferrer">SPOTIFY</a>`;return `<article class="card"><a href="${primary}" target="_blank" rel="noopener noreferrer" aria-label="Open ${title}"><img class="art" src="${x.art}" alt="${title} — LIL SYNN artwork" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fallbackArt(x.title)}'"></a><div class="body"><p class="type">${esc(x.type)}</p><h2 class="name">${title}</h2><div class="links">${button}</div></div></article>`;}
async function load(){
 try{
  const res=await fetch(API,{headers:{Accept:'application/vnd.github+json'}});if(!res.ok)throw new Error('GitHub artwork directory unavailable');
  const files=(await res.json()).filter(x=>x.type==='file'&&/\.jpg$/i.test(x.name)&&/^\d+_lil_synn_/i.test(x.name));
  files.sort((a,b)=>parseInt(b.name,10)-parseInt(a.name,10));
  const releases=files.map(f=>{const title=titleFromFile(f.name);const key=f.name.replace(/^\d+_lil_synn_/i,'').replace(/\.jpg$/i,'');return{title,type:special[key]||'Single',art:ART_DIR+encodeURIComponent(f.name).replace(/%2F/g,'/'),number:parseInt(f.name,10)};});
  releases.push({title:'Touching to the North',type:'Album',art:specialLinks['touching to the north'].art,url:specialLinks['touching to the north'].url,source:'SoundCloud',number:-1});
  grid.innerHTML=releases.map(card).join('')+`<div class="note">${releases.length} releases shown. Artwork is sourced from the official LIL SYNN GitHub artwork library, with Touching to the North using its supplied SoundCloud artwork. <a href="https://open.spotify.com/artist/6ozcOAnRAUPn3z5c0GR5kU" target="_blank" rel="noopener noreferrer">Open LIL SYNN on Spotify</a>.</div>`;
 }catch(err){grid.innerHTML=`<div class="status">The release archive could not load right now. <a href="https://github.com/LILSYNNOFFICIAL/LILSYNNOFFICIAL/tree/main/assets/images/icons/album_art">View the official artwork archive on GitHub.</a></div>`;console.error(err);}
}
load();
</script>
</body></html>
