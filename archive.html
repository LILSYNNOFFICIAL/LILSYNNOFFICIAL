<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIL SYNN | Archive Explorer</title><meta name="description" content="Search and explore the complete LIL SYNN release archive by release, track, type, and streaming platform."><link rel="canonical" href="https://lilsynn.com/archive.html"><style>body{background:transparent;color:#fff}.archive-page{max-width:1180px;margin:0 auto;padding:150px 24px 80px}.archive-page h1{text-align:center;font:700 clamp(32px,6vw,60px) Orbitron,sans-serif;letter-spacing:.08em;margin:0 0 10px}.intro{text-align:center;color:#bbb;max-width:780px;margin:0 auto 28px;line-height:1.6}.explorer{background:rgba(8,8,8,.84);border:1px solid rgba(255,0,143,.28);border-radius:18px;padding:18px;margin-bottom:24px}.controls{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(3,minmax(130px,1fr));gap:10px}.control{display:flex;flex-direction:column;gap:6px}.control label{font:700 11px Rajdhani,sans-serif;letter-spacing:.12em;color:#999}.control input,.control select{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid rgba(255,0,143,.42);border-radius:9px;padding:11px 12px;font:600 14px Rajdhani,sans-serif}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;color:#999;font:600 12px Rajdhani,sans-serif;letter-spacing:.08em}.summary strong{color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;min-height:330px;background:rgba(8,8,8,.84);border:1px solid rgba(255,255,255,.09);border-radius:14px;overflow:hidden;transition:transform .2s ease,border-color .2s ease}.card:hover{transform:translateY(-2px);border-color:rgba(255,0,143,.5)}.art-wrap{display:flex;justify-content:center;align-items:center;padding:14px;background:rgba(0,0,0,.24)}.art{display:block;width:min(100%,220px);aspect-ratio:1;object-fit:contain;border-radius:10px}.card-body{display:flex;flex-direction:column;flex:1;padding:14px 16px 16px}.eyebrow{color:#ff4fd8;font:700 10px Rajdhani,sans-serif;letter-spacing:.14em}.card h2{font:700 19px Orbitron,sans-serif;line-height:1.25;margin:8px 0}.card h2 a{color:inherit;text-decoration:none}.card h2 a:hover,.card h2 a:focus-visible{color:var(--ls-glow)}.card p{color:#aaa;font:600 13px Rajdhani,sans-serif;line-height:1.45;margin:0 0 14px}.tracks{color:#777;display:block}.set{color:#aaa;font:700 11px Rajdhani,sans-serif;letter-spacing:.1em}.track-hit{display:block;margin-top:4px;color:#ff4fd8;font:700 10px Rajdhani,sans-serif;letter-spacing:.08em}.card-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.platforms{color:#999;font:700 10px Rajdhani,sans-serif;letter-spacing:.08em}.open{color:#fff;text-decoration:none;border:1px solid rgba(255,0,143,.48);border-radius:7px;padding:7px 9px;font:700 10px Rajdhani,sans-serif;letter-spacing:.1em}.open:hover,.open:focus-visible{color:#fff;border-color:#ff4fd8;background:rgba(255,0,143,.12)}.empty{text-align:center;color:#aaa;padding:55px 20px;border:1px dashed rgba(255,255,255,.13);border-radius:14px;grid-column:1/-1}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.archive-page{padding:132px 14px 55px}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:0}.art{width:min(100%,230px)}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}</style><script src="/site-global.js?v=20260914"></script></head><body><main class="archive-page" id="main-content"><h1>ARCHIVE EXPLORER</h1><p class="intro">Search the LIL SYNN catalog by release, track, format, or official streaming destination. Results preserve the canonical release set and route track searches into the correct album or EP.</p><section class="explorer" aria-label="Archive filters"><div class="controls"><div class="control"><label for="query">SEARCH</label><input id="query" type="search" autocomplete="off" placeholder="Release or track name…"></div><div class="control"><label for="type">TYPE</label><select id="type"><option value="all">All types</option><option value="album">Albums</option><option value="ep">EPs</option><option value="single">Singles</option></select></div><div class="control"><label for="platform">PLATFORM</label><select id="platform"><option value="all">All platforms</option><option value="spotify">Spotify</option><option value="apple">Apple Music</option><option value="soundcloud">SoundCloud</option></select></div><div class="control"><label for="sort">ORDER</label><select id="sort"><option value="catalog">Catalog order</option><option value="az">A → Z</option><option value="za">Z → A</option></select></div></div><div class="summary" aria-live="polite"><span><strong id="count">0</strong> RELEASE SETS MATCH</span><span>CANONICAL CATALOG</span></div></section><section id="results" class="grid" aria-label="Release archive results" aria-live="polite"></section></main><script>
const qEl=document.getElementById('query'),typeEl=document.getElementById('type'),platformEl=document.getElementById('platform'),sortEl=document.getElementById('sort'),results=document.getElementById('results'),countEl=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');
const base='/assets/images/icons/album_art/';
const artMap={neverknown:'Never Known_album_cover.jpg',homeacousticversion:'home_acoustic_version.png',ididitagain:'I DID IT AGAIN.jpg',rescueyouacousticversion:'RESCUE_YOU_A.png',somewhereinbetween:'57_lil_synn_somewhere_in_between.jpg',hellogoodbye:'11_lil_synn_hello_goodbye.jpg',blackglass:'23_lil_synn_black_glass.jpg',heal:'30_lil_synn_heal.jpg',enough:'15_lil_synn_enough.jpg',dontsayit:'38_lil_synn_don_t_say_it.jpg',touchingtothenorth:'01 - Astral Signal - LIL SYN-artwork.jpg'};
let data=null;
const tracksFor=t=>Array.isArray(data?.groups?.[t]?.tracks)?data.groups[t].tracks:[];
const typeFor=t=>data?.groups?.[t]?.type?.toLowerCase()||'single';
const artFor=t=>{const k=norm(t),file=artMap[k]||(window.LIL_SYNN_ART_MAP||{})[k];return file?base+encodeURIComponent(file):''};
const hasPlatform=(title,platform)=>{const g=data?.groups?.[title],tracks=tracksFor(title);if(platform==='spotify')return Boolean(data?.spotify?.[title]||g?.spotify||tracks.some(t=>data?.trackSpotify?.[t]));if(platform==='apple')return Boolean(data?.apple?.[title]||g?.apple||tracks.some(t=>data?.apple?.[t]));if(platform==='soundcloud')return Boolean(data?.soundcloud?.[title]||g?.soundcloud||data?.trackSoundcloud?.[title]||tracks.some(t=>data?.trackSoundcloud?.[t]));return true};
const syncUrl=()=>{const p=new URLSearchParams();if(qEl.value.trim())p.set('q',qEl.value.trim());if(typeEl.value!=='all')p.set('type',typeEl.value);if(platformEl.value!=='all')p.set('platform',platformEl.value);if(sortEl.value!=='catalog')p.set('sort',sortEl.value);history.replaceState(null,'',p.toString()?`${location.pathname}?${p}`:location.pathname)};
const render=()=>{if(!data)return;const query=norm(qEl.value),type=typeEl.value,platform=platformEl.value,sort=sortEl.value;let order=[...(data.order||[])].filter(title=>{const tracks=tracksFor(title),hay=norm([title,...tracks].join(' '));return(!query||hay.includes(query))&&(type==='all'||typeFor(title)===type)&&hasPlatform(title,platform)});if(sort==='az')order.sort((a,b)=>a.localeCompare(b));if(sort==='za')order.sort((a,b)=>b.localeCompare(a));countEl.textContent=order.length;if(!order.length){results.innerHTML='<div class="empty">No release sets match the current archive filters.</div>';syncUrl();return}results.innerHTML=order.map((title,i)=>{const g=data.groups?.[title],tracks=tracksFor(title),type=typeFor(title).toUpperCase(),art=artFor(title),q=norm(qEl.value),hit=q?tracks.find(t=>norm(t).includes(q)):'';const platforms=[hasPlatform(title,'spotify')?'SPOTIFY':'',hasPlatform(title,'apple')?'APPLE MUSIC':'',hasPlatform(title,'soundcloud')?'SOUNDCLOUD':''].filter(Boolean).join(' · ')||'ARCHIVE ONLY';const detail='/release.html?id='+encodeURIComponent(hit||title);const trackText=tracks.length?tracks.slice(0,5).join(' · ')+(tracks.length>5?' · …':''):'Single release';return `<article class="card">${art?`<a class="art-wrap" href="${detail}" aria-label="Open ${esc(title)} release set"><img class="art" src="${art}" alt="${esc(title)} artwork" loading="lazy" decoding="async"></a>`:''}<div class="card-body"><div class="eyebrow">${String(i+1).padStart(2,'0')} · ${esc(type)}</div><h2><a href="${detail}">${esc(title)}</a></h2><p><span class="set">${g?'RELEASE SET':'SINGLE'}</span><br><span class="tracks">${esc(trackText)}</span>${hit?`<span class="track-hit">TRACK MATCH · ${esc(hit)}</span>`:''}</p><div class="card-footer"><span class="platforms">${esc(platforms)}</span><a class="open" href="${detail}">OPEN ↗</a></div></div></article>`}).join('');syncUrl()};
const loadState=()=>{const p=new URLSearchParams(location.search);qEl.value=p.get('q')||'';typeEl.value=['all','album','ep','single'].includes(p.get('type'))?p.get('type'):'all';platformEl.value=['all','spotify','apple','soundcloud'].includes(p.get('platform'))?p.get('platform'):'all';sortEl.value=['catalog','az','za'].includes(p.get('sort'))?p.get('sort'):'catalog'};
[qEl,typeEl,platformEl,sortEl].forEach(el=>el.addEventListener('input',render));
[typeEl,platformEl,sortEl].forEach(el=>el.addEventListener('change',render));
fetch('/release-catalog.json',{cache:'default'}).then(r=>{if(!r.ok)throw Error('catalog unavailable');return r.json()}).then(c=>{data=c;loadState();render()}).catch(()=>{results.innerHTML='<div class="empty">Unable to load the release archive.</div>'});
</script></body></html>
