<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIL SYNN | Universe</title><meta name="description" content="Enter the LIL SYNN universe through releases, transmissions, visual identities, and the evolving archive."><link rel="canonical" href="https://lilsynn.com/universe.html"><style>body{background:transparent;color:#fff}.universe{max-width:1120px;margin:0 auto;padding:150px 24px 80px}.universe h1{text-align:center;font:700 clamp(34px,6vw,62px) Orbitron,sans-serif;letter-spacing:.08em;margin:0}.lead{text-align:center;color:#aaa;max-width:760px;margin:14px auto 36px;line-height:1.6}.timeline{position:relative;max-width:900px;margin:0 auto;padding-left:28px}.timeline:before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:linear-gradient(var(--ls-pink),rgba(255,0,143,.08))}.node{position:relative;margin:0 0 18px;padding:20px;border:1px solid rgba(255,0,143,.2);border-radius:16px;background:rgba(5,5,8,.78)}.node:before{content:"";position:absolute;left:-27px;top:25px;width:10px;height:10px;border-radius:50%;background:var(--ls-pink);box-shadow:0 0 18px rgba(255,0,143,.55)}.node-label{color:var(--ls-glow);font:700 10px Rajdhani,sans-serif;letter-spacing:.16em}.node h2{margin:6px 0 8px;font:700 20px Orbitron,sans-serif}.node p{margin:0;color:#aaa;font:1rem/1.55 Rajdhani,sans-serif}.node-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.node-actions a{color:#fff;text-decoration:none;border:1px solid rgba(255,0,143,.35);border-radius:8px;padding:7px 9px;font:700 10px Rajdhani,sans-serif;letter-spacing:.08em}.signal-history{max-width:900px;margin:60px auto 0}.signal-history h2{text-align:center;font:700 30px Orbitron,sans-serif;color:var(--ls-pink)}.transmissions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}.transmission{padding:18px;border:1px solid rgba(255,0,143,.18);border-radius:14px;background:rgba(5,5,8,.7)}.transmission b{color:var(--ls-glow);font:700 10px Rajdhani,sans-serif;letter-spacing:.14em}.transmission h3{margin:7px 0;font:700 16px Orbitron,sans-serif}.transmission p{margin:0;color:#aaa;font:14px/1.5 Rajdhani,sans-serif}.egg{margin:50px auto 0;max-width:700px;text-align:center;padding:26px;border:1px solid rgba(255,255,255,.1);border-radius:16px;color:#777;font:600 12px Rajdhani,sans-serif;letter-spacing:.1em}@media(max-width:800px){.transmissions{grid-template-columns:1fr 1fr}}@media(max-width:600px){.universe{padding:132px 14px 55px}.timeline{padding-left:24px}.timeline:before{left:6px}.node:before{left:-23px}.transmissions{grid-template-columns:1fr}}</style><script src="/site-global.js?v=20260914"></script></head><body><main class="universe" id="main-content"><h1>LIL SYNN UNIVERSE</h1><p class="lead">Music, visuals, transmissions, and story are connected here as one evolving digital world. The catalog remains the source of truth.</p><section class="timeline" id="timeline" aria-label="LIL SYNN release timeline"></section><section class="signal-history"><h2>TRANSMISSION HISTORY</h2><div class="transmissions" id="transmissions"></div></section><div class="egg">UNKNOWN FREQUENCIES MAY EXIST. TRY THE HEADER LOGO FIVE TIMES.</div></main><script>const timeline=document.getElementById('timeline'),historyEl=document.getElementById('transmissions'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));Promise.all([fetch('/release-catalog.json',{cache:'default'}).then(r=>r.json()),fetch('/transmissions.json',{cache:'default'}).then(r=>r.json())]).then(([catalog,transmissions])=>{timeline.innerHTML=(catalog.order||[]).map((title,i)=>{const g=catalog.groups?.[title],type=(g?.type||'SINGLE').toUpperCase();return `<article class="node"><span class="node-label">CATALOG ${String(i+1).padStart(2,'0')} · ${type}</span><h2>${esc(title)}</h2><p>${g?.tracks?.length?esc(g.tracks.length+' tracks in the canonical set.'):'Single release in the canonical catalog.'}</p><div class="node-actions"><a href="/release.html?id=${encodeURIComponent(title)}">RELEASE</a><a href="/archive.html?q=${encodeURIComponent(title)}">ARCHIVE</a><a href="/gallery.html">VISUALS</a></div></article>`}).join('');const list=Array.isArray(transmissions)?transmissions:(transmissions?.items||[]);historyEl.innerHTML=list.map((x,i)=>`<article class="transmission"><b>TRANSMISSION ${String(i+1).padStart(3,'0')}</b><h3>${esc(x.title||x.name||'SIGNAL')}</h3><p>${esc(x.message||x.description||x.body||'Signal received.')}</p></article>`).join('')}).catch(()=>{timeline.innerHTML='<div class="node">UNIVERSE DATA UNAVAILABLE</div>';historyEl.innerHTML=''})</script></body></html>
